<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Відгуки — RadioBox Admin</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body { background: #f1f5f9; padding: 0; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: #0d2b4e; color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; font-size: 20px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { list-style: none; padding: 0; margin: 20px 0; flex: 1; }
        .nav-links li a { display: block; padding: 12px 20px; color: #cbd5e1; text-decoration: none; font-weight: 600; transition: 0.2s; border-left: 4px solid transparent; }
        .nav-links li a:hover, .nav-links li a.active { background: rgba(255,255,255,0.05); color: white; border-left-color: #189BFF; }
        .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-logout { color: #fca5a5; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .main-content { flex: 1; overflow-y: auto; padding: 30px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { margin: 0; font-size: 24px; color: #0f172a; font-weight: 800; }

        .rev-admin-list { display: flex; flex-direction: column; gap: 15px; max-width: 800px; }
        .rev-admin-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .rev-admin-card.hidden-rev { background: #fff1f2; border-color: #fecaca; }

        .ra-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .ra-author { font-weight: 700; font-size: 15px; }
        .ra-date { color: #64748b; }
        .ra-text { color: #334155; line-height: 1.5; margin-bottom: 15px; }

        .ra-reply-box { background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .ra-reply-label { font-size: 12px; font-weight: 700; color: #0d2b4e; margin-bottom: 5px; display: block; }
        .ra-textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; padding: 8px; font-size: 14px; min-height: 60px; resize: vertical; margin-bottom: 10px; }

        .ra-actions { display: flex; justify-content: space-between; align-items: center; }
        .btn-small { padding: 6px 12px; font-size: 13px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; }
        .btn-blue { background: #0d2b4e; color: #fff; }
        .btn-red { background: transparent; color: #ef4444; }
        .btn-vis { background: #e2e8f0; color: #333; margin-right: 10px; }

        /* Языки в админке */
        .admin-lang { font-size:14px; font-weight:600; margin-right: 20px; }
        .admin-lang a { text-decoration:none; color:#94a3b8; margin-left:8px; }
        .admin-lang a.active { color:#0f172a; text-decoration:underline; }
    </style>
    <script src="/admin/admin.js" defer></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">RadioBox Seller</div>
        <ul class="nav-links">
            <li><a href="/admin/ua/dashboard">Замовлення</a></li>
            <li><a href="/admin/ua/products">Товари</a></li>
            <li><a href="/admin/ua/reviews" class="active">Відгуки</a></li>
            <li><a href="/admin/ua/showcase.html">Вітрина (Сортування)</a></li>
            <li><a href="/admin/ua/banners">Банери</a></li>
            <li><a href="/admin/ua/settings">Налаштування</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/admin/logout" class="btn-logout">Вийти</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Відгуки покупців</h1>
            <div style="display:flex; align-items:center; gap:20px;">
                <div class="admin-lang">
                    <a href="/admin/ru/reviews">RU</a>
                    <a href="/admin/ua/reviews" class="active">UA</a>
                </div>
                <button class="btn-primary" onclick="AdminReviews.load()">↻ Оновити</button>
            </div>
        </div>

        <div id="reviewsContainer" class="rev-admin-list">
            <div style="text-align:center;">Завантаження...</div>
        </div>
    </main>
</body>
</html>
