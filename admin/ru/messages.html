<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сообщения — RadioBox</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background: #f1f5f9; padding: 0; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: #0d2b4e; color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; font-size: 20px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { list-style: none; padding: 0; margin: 20px 0; flex: 1; }
        .nav-links li a { display: block; padding: 12px 20px; color: #cbd5e1; text-decoration: none; font-weight: 600; transition: 0.2s; border-left: 4px solid transparent; }
        .nav-links li a:hover, .nav-links li a.active { background: rgba(255,255,255,0.05); color: white; border-left-color: #189BFF; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 20px; }
        .page-header { margin-bottom: 20px; }
        .page-title { margin: 0; font-size: 24px; color: #0f172a; font-weight: 800; }

        /* Лейаут Чата */
        .chat-container { display: flex; flex: 1; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; }

        /* Список тикетов (Слева) */
        .tickets-list { width: 300px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; background: #f8fafc; }
        .tickets-header { padding: 15px; font-weight: bold; border-bottom: 1px solid #e2e8f0; background: white; }
        .tickets-body { flex: 1; overflow-y: auto; }
        .ticket-item { padding: 15px; border-bottom: 1px solid #e2e8f0; cursor: pointer; transition: background 0.2s; }
        .ticket-item:hover { background: #f1f5f9; }
        .ticket-item.active { background: #e0f2fe; border-left: 4px solid #189BFF; }
        .ticket-id { font-size: 12px; color: #64748b; margin-bottom: 5px; }
        .ticket-client { font-weight: 600; color: #0f172a; font-size: 14px; word-break: break-all; }
        .ticket-date { font-size: 11px; color: #94a3b8; margin-top: 5px; text-align: right; }

        /* Окно переписки (Справа) */
        .chat-window { flex: 1; display: flex; flex-direction: column; background: white; }
        .chat-window-header { padding: 15px 20px; border-bottom: 1px solid #e2e8f0; font-weight: bold; color: #0f172a; background: #f8fafc; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff; }

        .msg-bubble { max-width: 70%; padding: 10px 15px; border-radius: 12px; font-size: 14px; position: relative; }
        .msg-bubble p { margin: 0; word-wrap: break-word; }
        .msg-bubble .time { font-size: 10px; opacity: 0.6; display: block; margin-top: 5px; text-align: right; }

        .msg-client { background: #f1f5f9; color: #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-manager { background: #0d2b4e; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

        .chat-input-box { padding: 15px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; background: #f8fafc; }
        .chat-input-box input { flex: 1; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        .chat-input-box button { background: #189BFF; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .chat-input-box button:hover { background: #0ea5e9; }

        .chat-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 16px; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">RadioBox Seller</div>
        <ul class="nav-links">
            <li><a href="/admin/ru/dashboard">Заказы</a></li>
            <li><a href="/admin/ru/products">Товары</a></li>
            <li><a href="/admin/ru/reviews">Отзывы</a></li>
            <li><a href="/admin/ru/messages" class="active">Сообщения (Чат)</a></li>
            <li><a href="/admin/ru/showcase.html">Витрина (Сортировка)</a></li>
            <li><a href="/admin/ru/banners">Баннеры</a></li>
            <li><a href="/admin/ru/settings">Настройки</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Диалоги с клиентами</h1>
        </div>

        <div class="chat-container">
            <div class="tickets-list">
                <div class="tickets-header">Активные диалоги</div>
                <div class="tickets-body" id="ticketsBox">
                    <div style="padding:15px; text-align:center; color:#888;">Загрузка...</div>
                </div>
            </div>

            <div class="chat-window" id="chatArea" style="display: none;">
                <div class="chat-window-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="chatHeaderTitle">Диалог</span>
                    <button id="deleteTicketBtn" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">Удалить чат</button>
                </div>
                <div class="chat-messages" id="messagesBox"></div>
                <div class="chat-input-box">
                    <input type="text" id="msgInput" placeholder="Введите ответ...">
                    <button id="sendBtn">Отправить</button>
                </div>
            </div>

            <div class="chat-placeholder" id="chatPlaceholder">
                <span style="font-size:40px;">💬</span>
                Выберите диалог из списка слева
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ticketsBox = document.getElementById('ticketsBox');
            const messagesBox = document.getElementById('messagesBox');
            const chatArea = document.getElementById('chatArea');
            const chatPlaceholder = document.getElementById('chatPlaceholder');
            const chatHeaderTitle = document.getElementById('chatHeaderTitle');
            const msgInput = document.getElementById('msgInput');
            const sendBtn = document.getElementById('sendBtn');
            const deleteTicketBtn = document.getElementById('deleteTicketBtn');

            let socket = io();
            let activeTicketId = null;

            // Звук уведомления (системный короткий писк)
            const notifySound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

            // --- НЕВИДИМАЯ РАЗБЛОКИРОВКА ЗВУКА ---
            function unlockAudio() {
                notifySound.play().then(() => {
                    notifySound.pause();
                    notifySound.currentTime = 0;
                }).catch(() => {});

                document.removeEventListener('click', unlockAudio);
            }

            document.addEventListener('click', unlockAudio);
            // -------------------------------------------

            // 1. Загрузка списка тикетов
            async function loadTickets() {
                try {
                    const res = await fetch('/api/admin/chat/tickets');
                    const data = await res.json();

                    if (data.success) {
                        ticketsBox.innerHTML = '';
                        let totalUnread = 0; // Счетчик новых сообщений

                        if (data.tickets.length === 0) {
                            const emptyText = document.documentElement.lang === 'uk' ? 'Немає діалогів' : 'Нет диалогов';
                            ticketsBox.innerHTML = `<div style="padding:15px; text-align:center; color:#888;">${emptyText}</div>`;
                        } else {
                            data.tickets.forEach(ticket => {
                                const isUnread = ticket.unread_admin === 1;
                                if (isUnread) totalUnread++;

                                const div = document.createElement('div');
                                div.className = `ticket-item ${ticket.id === activeTicketId ? 'active' : ''} ${isUnread ? 'unread' : ''}`;

                                const ticketText = document.documentElement.lang === 'uk' ? 'Тікет' : 'Тикет';
                                const newText = document.documentElement.lang === 'uk' ? 'Нове' : 'Новое';

                                div.innerHTML = `
                                    <div class="ticket-id">${ticketText} #${ticket.id} ${isUnread ? '<span class="unread-badge">' + newText + '</span>' : ''}</div>
                                    <div class="ticket-client">${ticket.client_id}</div>
                                    <div class="ticket-date">${ticket.updated_at.substring(0, 16)}</div>
                                `;
                                div.onclick = (e) => openTicket(ticket.id, ticket.client_id, e, isUnread);
                                ticketsBox.appendChild(div);
                            });
                        }

                        // Обновляем визуальный счетчик в боковом меню (возле слова "Сообщения (Чат)")
                        const navLink = document.querySelector('.nav-links a[href*="/messages"]');
                        if (navLink) {
                            const linkText = document.documentElement.lang === 'uk' ? 'Повідомлення (Чат)' : 'Сообщения (Чат)';
                            navLink.innerHTML = `${linkText} ${totalUnread > 0 ? '<span class="unread-badge">' + totalUnread + '</span>' : ''}`;
                        }
                    }
                } catch (e) {
                    console.error("Ошибка загрузки тикетов", e);
                }
            }

            // 2. Открытие конкретного диалога
            async function openTicket(id, clientName, event, isUnread) {
                activeTicketId = id;
                chatPlaceholder.style.display = 'none';
                chatArea.style.display = 'flex';

                const dialogText = document.documentElement.lang === 'uk' ? 'Діалог з:' : 'Диалог с:';
                const loadText = document.documentElement.lang === 'uk' ? 'Завантаження історії...' : 'Загрузка истории...';

                chatHeaderTitle.textContent = `${dialogText} ${clientName}`;
                messagesBox.innerHTML = `<div style="text-align:center; padding:20px; color:#888;">${loadText}</div>`;

                // Подсветка активного тикета
                document.querySelectorAll('.ticket-item').forEach(el => el.classList.remove('active'));
                if (event && event.currentTarget) {
                    event.currentTarget.classList.add('active');
                }

                // Подключаемся к комнате
                socket.emit('join', { ticket_id: id });

                // Если диалог был непрочитанным, сбрасываем статус в БД и обновляем список
                if (isUnread) {
                    await fetch(`/api/admin/chat/read/${id}`, { method: 'POST' });
                    loadTickets();
                }

                // Грузим историю
                const res = await fetch(`/api/chat/history/${id}`);
                const data = await res.json();

                messagesBox.innerHTML = '';
                if (data.success) {
                    data.messages.forEach(msg => appendMessage(msg));
                    scrollToBottom();
                }
            }

            // 3. Отрисовка сообщения
            function appendMessage(msg) {
                const div = document.createElement('div');
                div.className = `msg-bubble ${msg.sender === 'manager' ? 'msg-manager' : 'msg-client'}`;
                div.innerHTML = `<p>${msg.text}</p><span class="time">${msg.created_at.substring(11, 16)}</span>`;
                messagesBox.appendChild(div);
            }

            function scrollToBottom() {
                messagesBox.scrollTop = messagesBox.scrollHeight;
            }

            // 4. Отправка сообщения менеджером
            function sendMessage() {
                const text = msgInput.value.trim();
                if (!text || !activeTicketId) return;

                socket.emit('send_message', {
                    ticket_id: activeTicketId,
                    sender: 'manager',
                    text: text
                });

                msgInput.value = '';
                setTimeout(loadTickets, 500);
            }

            sendBtn.addEventListener('click', sendMessage);
            msgInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            // 5. Прием новых сообщений
            socket.on('receive_message', (msg) => {
                if (activeTicketId && String(msg.ticket_id) === String(activeTicketId)) {
                    appendMessage(msg);
                    scrollToBottom();

                    // Если сообщение пришло в открытый прямо сейчас диалог от клиента, сразу помечаем его прочитанным
                    if (msg.sender === 'client') {
                        fetch(`/api/admin/chat/read/${activeTicketId}`, { method: 'POST' });
                    }
                }

                // Проигрываем звук, если пишет клиент
                if (msg.sender === 'client') {
                    notifySound.play().catch(e => console.warn('Аудио заблокировано браузером', e));
                }

                // Обновляем список (появится бейдж, и тикет всплывет наверх)
                loadTickets();
            });

            // 6. Удаление тикета
            deleteTicketBtn.addEventListener('click', async () => {
                if (!activeTicketId) return;

                const confirmMsg = document.documentElement.lang === 'uk'
                    ? 'Точно видалити цей діалог та всю його історію?'
                    : 'Точно удалить этот диалог и всю его историю?';

                if (!confirm(confirmMsg)) return;

                try {
                    const res = await fetch(`/api/admin/chat/ticket/${activeTicketId}`, {
                        method: 'DELETE'
                    });
                    const data = await res.json();

                    if (data.success) {
                        activeTicketId = null;
                        chatArea.style.display = 'none';
                        chatPlaceholder.style.display = 'flex';
                        loadTickets();
                    }
                } catch (e) {
                    console.error("Ошибка при удалении", e);
                }
            });

            // Стартовая загрузка
            loadTickets();
        });
    </script>
</body>
</html>
