<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadioBox — Товары</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
        /* Кнопки переключения вида */
        .view-btn {
            border: 1px solid #d7dbe3;
            background: #fff;
            border-radius: 8px;
            padding: 6px 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            line-height: 1;
        }

            .view-btn svg {
                width: 18px;
                height: 18px;
                display: block
            }

            .view-btn.is-active {
                background: #0d2b4e;
                color: #fff;
                border-color: #0d2b4e
            }

        /* Списочный вид */
        #catalog.list-view .showcase__grid {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .product-card--list {
            display: grid;
            grid-template-columns: 140px 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #e6e8ed;
            border-radius: 12px;
        }

            .product-card--list .product-card__img {
                width: 140px
            }

                .product-card--list .product-card__img img {
                    width: 120px;
                    height: auto;
                    object-fit: contain
                }

            .product-card--list .product-info {
                min-width: 0
            }

            .product-card--list .product-card__title {
                margin: 0 0 8px;
                font-size: 16px
            }

            .product-card--list .product-card__price {
                font-size: 20px;
                font-weight: 700;
                margin: 0 0 4px
            }

            .product-card--list .product-card__status {
                margin: 0 0 6px
            }

            .product-card--list .product-meta-wrap {
                font-size: 13px;
                color: #6b7280
            }

            .product-card--list .product-cta {
                justify-self: end
            }

            .product-card--list .product-card__buy {
                min-width: 120px
            }
    </style>

    <link rel="preload" as="image" href="../assets/icons/viber_under_cursor.png">
</head>
<body>

    <div id="header-placeholder"></div>

    <!-- ===== Двухколоночная область ===== -->
    <section class="home-layout container">
        <!-- Левая колонка -->
        <div id="sidebar-placeholder"></div>

        <!-- Правая колонка -->
        <div class="home-right" data-side-watch>
            <!-- Хлебные крошки -->
            <nav class="breadcrumbs" aria-label="Хлебные крошки">
                <a class="crumb-home" href="index.html" aria-label="Главная">🏠</a>
                <span class="crumb-sep" aria-hidden="true">›</span>
                <a class="crumb-current" href="products.html" aria-current="page">Товары</a>
            </nav>

            <!-- Группы товаров (10 категорий + реальные фото) -->
            <section class="groups" id="groups">
                <h2 class="groups__title">Группы товаров</h2>
                <div class="groups__grid" id="all-categories-grid">
                </div>
            </section>

            <!-- Витрина -->
            <section class="showcase" id="catalog" data-side-watch>
                <!-- (без заголовка «Популярные товары») -->
                <!-- Панель управления -->
                <div class="rf-row" style="justify-content:flex-start; gap:16px; margin:0 0 12px;">
                    <label style="font-size:13px; color:#374151;">
                        Сортировка:
                        <select id="sortSelect" style="border:1px solid #d7dbe3; border-radius:8px; padding:6px 8px; margin-left:6px;">
                            <option value="default" selected>по порядку</option>
                            <option value="price_asc">цена ↑</option>
                            <option value="price_desc">цена ↓</option>
                        </select>
                    </label>

                    <div role="group" aria-label="Вид" style="margin-left:auto; display:flex; align-items:center; gap:8px;">
                        <button id="btnGrid" type="button" class="view-btn is-active" aria-pressed="true" title="Сетка">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" /></svg>
                            Сетка
                        </button>
                        <button id="btnList" type="button" class="view-btn" aria-pressed="false" title="Список">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z" /></svg>
                            Список
                        </button>
                    </div>
                </div>

                <div id="catalogGrid" class="showcase__grid" aria-live="polite"></div>

                <!-- Низ витрины -->
                <div class="rf-row" style="align-items:center; justify-content:space-between; margin-top:12px;">
                    <label style="font-size:13px; color:#374151;">
                        Товаров на странице:
                        <select id="pageSizeSelect" style="border:1px solid #d7dbe3; border-radius:8px; padding:6px 8px; margin-left:6px;">
                            <option value="6" selected>6</option>
                            <option value="12">12</option>
                            <option value="24">24</option>
                        </select>
                    </label>

                    <nav id="catalogPager" class="rev-pager" aria-label="Страницы каталога"></nav>
                </div>
            </section>

            <!-- !!! ВИДЖЕТ ИСТОРИИ !!! -->
            <div id="viewed-widget" style="margin-top: 40px;"></div>

        </div>
    </section>

    <!-- Плавающая кнопка Viber -->
    <a class="float-viber" href="viber://chat?number=%2B380930728887" aria-label="Открыть чат в Viber" title="Открыть чат в Viber">
        <img class="vb vb--idle" src="../assets/icons/viber_without_cursor.png" alt="Viber" width="44" height="44">
        <img class="vb vb--hover" src="../assets/icons/viber_under_cursor.png" alt="" aria-hidden="true" width="44" height="44">
    </a>

    <div id="footer-placeholder"></div>

    <!-- общий скрипт сайта -->
    <script src="../script.js" defer></script>

    <!-- ===== Сценарий витрины (localStorage + пагинация) ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // LS-ключи
            const LS_KEY = 'rb_catalog_v1_ru';
            const LS_PAGESIZE = 'rb_catalog_pagesize';
            const LS_SORT = 'rb_catalog_sort';
            const LS_VIEW = 'rb_catalog_view';

            const CATS = [
                ['solder', 'Паяльное оборудование'],
                ['repair', 'Всё для ремонта, тестеры, инструменты'],
                ['consum', 'Расходные материалы'],
                ['osc', 'Осциллографы'],
                ['prog', 'Программаторы'],
                ['meas', 'Измерительные приборы'],
                ['rmods', 'Радиомодули'],
                ['rparts', 'Радиодетали'],
                ['cables', 'Кабели, разъёмы, штекеры'],
                ['psu', 'Источники питания']
            ];

            // ==== helpers (LS) ====
            const loadItems = () => {
                try {
                    const s = localStorage.getItem(LS_KEY);
                    if (!s) return []; const obj = JSON.parse(s); return Array.isArray(obj?.items) ? obj.items : [];
                } catch { return []; }
            };
            const saveItems = (items) => { try { localStorage.setItem(LS_KEY, JSON.stringify({ items })); } catch { } };

            // ==== элементы UI ====
            const sortSelect = document.getElementById('sortSelect');
            const pageSizeSelect = document.getElementById('pageSizeSelect');
            const pager = document.getElementById('catalogPager');
            const grid = document.getElementById('catalogGrid');
            const btnGrid = document.getElementById('btnGrid');
            const btnList = document.getElementById('btnList');
            const catalogSection = document.getElementById('catalog');

            const fromLSint = (k, def) => {
                const v = localStorage.getItem(k); const n = v == null ? NaN : parseInt(v, 10);
                return Number.isFinite(n) && n > 0 ? n : def;
            };
            const fromLS = (k, def) => localStorage.getItem(k) || def;

            // ==== состояние ====
            const hashCat = (location.hash || '').replace(/^#cat-/, '');
            const allItems = loadItems();
            let items = (hashCat && allItems.some(p => p.category === hashCat)) ? allItems.filter(p => p.category === hashCat) : allItems;

            let pageSize = fromLSint(LS_PAGESIZE, 6);
            let current = 1;
            let sortMode = fromLS(LS_SORT, 'default');
            let view = fromLS(LS_VIEW, 'grid'); // 'grid' | 'list'

            pageSizeSelect.value = String(pageSize);
            sortSelect.value = sortMode;

            // ==== сортировка ====
            const by = (k) => (a, b) => (a[k] < b[k] ? -1 : a[k] > b[k] ? 1 : 0);
            function sortItems(arr) {
                const c = arr.slice();

                c.sort((a, b) => {
                    // Сначала всегда сортируем по наличию (1 - есть, 0 - нет)
                    // b.in_stock - a.in_stock заставит товары в наличии быть первыми
                    if (b.in_stock !== a.in_stock) {
                        return b.in_stock - a.in_stock;
                    }

                    // Если наличие одинаковое, применяем выбранную сортировку
                    if (sortMode === 'price_asc') {
                        return a.price - b.price;
                    } else if (sortMode === 'price_desc') {
                        return b.price - a.price;
                    } else {
                        // По умолчанию (по позиции или ID)
                        // Предполагаем, что у товаров есть поле position, если нет - можно использовать id
                        return (a.position || a.id) - (b.position || b.id);
                    }
                });

                return c;
            }

            // ==== пагинация (с “соседями”) ====
            const totalPages = (arr) => Math.max(1, Math.ceil(arr.length / pageSize));
            const slicePage = (arr, p) => arr.slice((p - 1) * pageSize, (p - 1) * pageSize + pageSize);

            function buildPager(total, current, neighbors = 1) {
                const pages = new Set([1, total]);
                for (let i = current - neighbors; i <= current + neighbors; i++) if (i > 1 && i < total) pages.add(i);
                const nums = [...pages].sort((a, b) => a - b);
                let html = link(current - 1, '←', current === 1);
                nums.forEach((p, i) => {
                    if (i > 0 && (p - nums[i - 1]) > 1) html += `<span>…</span>`;
                    html += p === current ? `<a href="#" data-page="${p}" aria-current="page"><strong>${p}</strong></a>`
                        : `<a href="#" data-page="${p}">${p}</a>`;
                });
                html += link(current + 1, '→', current === total);
                return html;

                function link(p, label, dis) {
                    return `<a href="#" data-page="${p}" aria-label="${label}" ${dis ? 'aria-disabled="true" style="pointer-events:none;opacity:.4;"' : ''}>${label}</a>`;
                }
            }

            // ==== карточки ====
            function gridCardHTML(p) {
                // 1. Жестко задаем язык, так как это RU файл
                const isUA = false;

                // 2. Безопасное название
                const pTitle = p.title_ru || p.title || p.title_ua || 'Товар';

                const stClass = p.in_stock ? 'is-instock' : 'is-out';
                const stText = p.in_stock ? 'Готово к отправке' : 'Нет в наличии';

                // Определяем единицу измерения: если 'set' -> комплект., иначе -> шт.
                const unitLabel = (p.unit_type === 'set') ? 'комплект.' : 'шт.';

                const qtyText = p.in_stock
                    ? `<div style="font-size:12px; color:#6b7280; margin-top:3px;">На складе: <b>${p.qty_stock}</b> ${unitLabel}</div>`
                    : '';

                return `
                <article class="product-card is-clickable" data-id="${p.id}" tabindex="0">
                  <div class="product-card__img"><img src="${p.image || ''}" alt="${pTitle}"></div>
                  <h3 class="product-card__title">${pTitle}</h3>
                  <div class="product-card__meta">Код: <span>${p.sku}</span></div>
                  <div class="product-card__price">${p.price} ₴</div>
                  <div class="product-card__status ${stClass}">${stText}</div>
                  ${qtyText}
                  <button class="product-card__buy" type="button" onclick="event.stopPropagation(); window.rbAddToCart(${p.id})">Купить</button>
                </article>`;
            }

            function listCardHTML(p) {
                const isUA = false;
                const pTitle = p.title_ru || p.title || p.title_ua || 'Товар'; // Безопасное название

                const stClass = p.in_stock ? 'is-instock' : 'is-out';
                const stText = p.in_stock ? 'Готово к отправке' : 'Нет в наличии';
                const qtyText = p.in_stock ? `<div style="font-size:13px; color:#666; margin-top:4px;">Остаток: <b>${p.qty_stock}</b> шт.</div>` : '';

                return `
                <article class="product-card product-card--list is-clickable" data-id="${p.id}" tabindex="0">
                  <div class="product-card__img"><img src="${p.image || ''}" alt="${pTitle}"></div>
                  <div class="product-info">
                    <h3 class="product-card__title">${pTitle}</h3>
                    <div class="product-card__price">${p.price} ₴</div>
                    <div class="product-card__status ${stClass}">
                        ${stText}
                        ${qtyText}
                    </div>
                    <div class="product-meta-wrap">Код: <span>${p.sku}</span></div>
                  </div>
                  <div class="product-cta">
                    <button class="product-card__buy" type="button" onclick="event.stopPropagation(); window.rbAddToCart(${p.id})">Купить</button>
                  </div>
                </article>`;
            }

            // ==== рендер ====
            function applyViewButtons() {
                btnGrid.classList.toggle('is-active', view === 'grid');
                btnGrid.setAttribute('aria-pressed', view === 'grid');
                btnList.classList.toggle('is-active', view === 'list');
                btnList.setAttribute('aria-pressed', view === 'list');
                catalogSection.classList.toggle('list-view', view === 'list');
            }

            function render() {
                applyViewButtons();
                const sorted = sortItems(items);
                const total = totalPages(sorted);
                if (current > total) current = total;

                grid.innerHTML = slicePage(sorted, current).map(view === 'list' ? listCardHTML : gridCardHTML).join('');
                pager.innerHTML = total > 1 ? buildPager(total, current, 1) : '';
            }

            window.renderCatalog = () => {
                // 1. Принудительно читаем свежие данные из LocalStorage
                const freshAllItems = loadItems();

                // 2. Заново применяем фильтр категории (если он есть в URL)
                const currentCat = (location.hash || '').replace(/^#cat-/, '');

                if (currentCat && freshAllItems.some(p => p.category === currentCat)) {
                    items = freshAllItems.filter(p => p.category === currentCat);
                } else {
                    items = freshAllItems;
                }

                // 3. Вызываем рендер уже с новыми переменными
                render();
            };

            // ==== события ====
            pager.addEventListener('click', (e) => {
                const a = e.target.closest('a[data-page]'); if (!a) return;
                e.preventDefault();
                const p = parseInt(a.dataset.page, 10); if (!Number.isFinite(p)) return;
                const total = totalPages(items);
                current = Math.min(Math.max(1, p), total);
                render();
                catalogSection?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            pageSizeSelect.addEventListener('change', () => {
                pageSize = parseInt(pageSizeSelect.value, 10) || 6;
                localStorage.setItem(LS_PAGESIZE, String(pageSize));
                current = 1; render();
            });

            sortSelect.addEventListener('change', () => {
                sortMode = sortSelect.value || 'default';
                localStorage.setItem(LS_SORT, sortMode);
                current = 1; render();
            });

            btnGrid.addEventListener('click', () => {
                if (view === 'grid') return;
                view = 'grid'; localStorage.setItem(LS_VIEW, view); render();
            });
            btnList.addEventListener('click', () => {
                if (view === 'list') return;
                view = 'list'; localStorage.setItem(LS_VIEW, view); render();
            });

            // смена категории из hash
            window.addEventListener('hashchange', () => {
                const cat = (location.hash || '').replace(/^#cat-/, '');
                const all = loadItems();
                items = (cat && all.some(p => p.category === cat)) ? all.filter(p => p.category === cat) : all;
                current = 1; render();
            });

            grid.addEventListener('click', (e) => {
            // 1. Если кликнули на кнопку "Купить" — ничего не делаем (пусть работает корзина)
            if (e.target.closest('.product-card__buy')) return;

            // 2. Ищем карточку
            const card = e.target.closest('.product-card');
            if (card && card.dataset.id) {
                // 3. Переходим на страницу товара
                window.location.href = `product.html?id=${card.dataset.id}`;
                }
            });

            // старт
            render();
        });
    </script>

    <!-- Боковые картинки -->
    <div class="side-art side-art--left" data-src="../assets/photos/photos_left_right/left.jpg" aria-hidden="true"></div>
    <div class="side-art side-art--right" data-src="../assets/photos/photos_left_right/right.jpg" aria-hidden="true"></div>

</body>
</html>
