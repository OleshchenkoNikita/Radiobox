<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadioBox — Категория</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="preload" as="image" href="../assets/icons/viber_under_cursor.png">
    <style>
        /* Кнопки переключения вида */
        .view-btn {
            border: 1px solid #d7dbe3;
            background: #fff;
            border-radius: 8px;
            padding: 6px 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            line-height: 1
        }

            .view-btn svg {
                width: 18px;
                height: 18px;
                display: block
            }

            .view-btn.is-active {
                background: #0d2b4e;
                color: #fff;
                border-color: #0d2b4e
            }

        /* Списковый вид */
        #catalog.list-view .showcase__grid {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .product-card--list {
            display: grid;
            grid-template-columns: 140px 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #e6e8ed;
            border-radius: 12px
        }

            .product-card--list .product-card__img {
                width: 140px
            }

                .product-card--list .product-card__img img {
                    width: 120px;
                    height: auto;
                    object-fit: contain
                }

            .product-card--list .product-info {
                min-width: 0
            }

            .product-card--list .product-card__title {
                margin: 0 0 8px;
                font-size: 16px
            }

            .product-card--list .product-card__price {
                font-size: 20px;
                font-weight: 700;
                margin: 0 0 4px
            }

            .product-card--list .product-card__status {
                margin: 0 0 6px
            }

            .product-card--list .product-meta-wrap {
                font-size: 13px;
                color: #6b7280
            }

            .product-card--list .product-cta {
                justify-self: end
            }

            .product-card--list .product-card__buy {
                min-width: 120px
            }

        /* Поднавигация подкатегорий */
        .subcats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 14px
        }

            .subcats a {
                display: inline-block;
                padding: 6px 10px;
                border: 1px solid #d7dbe3;
                border-radius: 999px;
                background: #fff;
                text-decoration: none;
                color: #0f172a;
                font-size: 13px
            }

                .subcats a[aria-current="page"] {
                    background: #0d2b4e;
                    border-color: #0d2b4e;
                    color: #fff
                }

        .social-btn {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            background: #fff;
            border: 1px solid #e6e8ed;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: inherit;
            transition: background-color .15s, border-color .15s, transform .06s
        }

            .social-btn:hover {
                background: #f5f7fb;
                border-color: #d9dee5
            }

            .social-btn:active {
                transform: scale(.98)
            }

            .social-btn svg {
                width: 18px;
                height: 18px;
                display: block
            }

        .lead {
            font-size: 14px;
            line-height: 1.6;
            color: #0f172a;
            margin: 6px 0 10px
        }

        .lead-row {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .catalog-empty {
            padding: 16px;
            border: 1px dashed #d7dbe3;
            border-radius: 12px;
            background: #fff;
            font-size: 14px;
            color: #374151;
        }

        /* Кликабельные карточки товара */
        .product-card.is-clickable {
            cursor: pointer;
        }

            .product-card.is-clickable:hover {
                border-color: #0d2b4e; /* если есть рамка — подсветится */
                box-shadow: 0 0 0 3px rgba(13,43,78,.12); /* «рамка» без сдвига верстки */
            }

            .product-card.is-clickable:focus-visible {
                outline: 2px solid #0d2b4e;
                outline-offset: 2px; /* видимый фокус с клавиатуры */
            }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <!-- ===== Двухколоночная область ===== -->
    <section class="home-layout container">
        <!-- Левая колонка -->
        <div id="sidebar-placeholder"></div>

        <!-- Правая колонка -->
        <div class="home-right" data-side-watch>
            <!-- Хлебные крошки -->
            <nav class="breadcrumbs" aria-label="Хлебные крошки">
                <a class="crumb-home" href="index.html" aria-label="Главная">🏠</a>
                <span class="crumb-sep" aria-hidden="true">›</span>
                <a href="products.html">Товары</a>
                <span class="crumb-sep" aria-hidden="true">›</span>
                <span id="crumbCat" class="crumb-current"></span>
                <span id="crumbSepSub" class="crumb-sep" aria-hidden="true" hidden>›</span>
                <span id="crumbSub" class="crumb-current" hidden></span>
            </nav>

            <!-- Заголовок -->
            <h2 id="catTitle" class="groups__title">Категория</h2>

            <!-- Подкатегории -->
            <nav id="subcats" class="subcats" aria-label="Подкатегории" hidden></nav>

            <!-- Витрина -->
            <section class="showcase" id="catalog" data-side-watch>
                <!-- Панель управления -->
                <div class="rf-row" style="justify-content:flex-start; gap:16px; margin:0 0 12px;">
                    <label style="font-size:13px; color:#374151;">
                        Сортировка:
                        <select id="sortSelect" style="border:1px solid #d7dbe3; border-radius:8px; padding:6px 8px; margin-left:6px;">
                            <option value="default" selected>по умолчанию</option>
                            <option value="price_asc">цена ↑</option>
                            <option value="price_desc">цена ↓</option>
                        </select>
                    </label>

                    <div role="group" aria-label="Вид" style="margin-left:auto; display:flex; align-items:center; gap:8px;">
                        <button id="btnGrid" type="button" class="view-btn is-active" aria-pressed="true" title="Сетка">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" /></svg>
                            Сетка
                        </button>
                        <button id="btnList" type="button" class="view-btn" aria-pressed="false" title="Список">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z" /></svg>
                            Список
                        </button>
                    </div>
                </div>

                <div id="catalogGrid" class="showcase__grid" aria-live="polite"></div>

                <!-- Низ -->
                <div class="rf-row" style="align-items:center; justify-content:space-between; margin-top:12px;">
                    <label style="font-size:13px; color:#374151;">
                        Товаров на странице:
                        <select id="pageSizeSelect" style="border:1px solid #d7dbe3; border-radius:8px; padding:6px 8px; margin-left:6px;">
                            <option value="6" selected>6</option>
                            <option value="12">12</option>
                            <option value="24">24</option>
                        </select>
                    </label>

                    <nav id="catalogPager" class="rev-pager" aria-label="Страницы каталога"></nav>
                </div>
            </section>

            <div id="viewed-widget" style="margin-top: 40px;"></div>

        </div>
    </section>

    <!-- Плавающая кнопка Viber -->
    <a class="float-viber"
       href="viber://chat?number=%2B380930728887"
       aria-label="Открыть чат в Viber"
       title="Открыть чат в Viber">
        <img class="vb vb--idle" src="../assets/icons/viber_without_cursor.png" alt="Viber" width="44" height="44">
        <img class="vb vb--hover" src="../assets/icons/viber_under_cursor.png" alt="" aria-hidden="true" width="44" height="44">
    </a>

    <div id="footer-placeholder"></div>

    <script src="../script.js" defer></script>

    <!-- ===== MODAL: График работы ===== -->
    <div class="hours-modal" aria-hidden="true">
        <div class="hours-modal__backdrop" data-hours-close></div>
        <section class="hours-modal__panel" role="dialog" aria-modal="true" aria-labelledby="hoursTitle">
            <header class="hours-modal__header">
                <h2 id="hoursTitle" class="hours-modal__title">График работы</h2>
                <button type="button" class="hours-modal__close" aria-label="Закрыть" data-hours-close>×</button>
            </header>
            <div class="hours-modal__body">
                <table class="hours-table">
                    <thead>
                        <tr><th scope="col">День</th><th scope="col">Время работы</th></tr>
                    </thead>
                    <tbody>
                        <tr><th scope="row">Понедельник</th><td>08:00 – 20:00</td></tr>
                        <tr><th scope="row">Вторник</th><td>08:00 – 20:00</td></tr>
                        <tr><th scope="row">Среда</th><td>08:00 – 20:00</td></tr>
                        <tr><th scope="row">Четверг</th><td>08:00 – 20:00</td></tr>
                        <tr><th scope="row">Пятница</th><td>08:00 – 20:00</td></tr>
                        <tr><th scope="row">Суббота</th><td>10:00 – 18:00</td></tr>
                        <tr><th scope="row">Воскресенье</th><td>10:00 – 15:00</td></tr>
                    </tbody>
                </table>
                <p class="hours-note">* Время указано для региона: Украина, г. Шостка</p>
            </div>
        </section>
    </div>
    <!-- ================================= -->
    <!-- ===== Логика категории (единый шаблон) ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // === 1. ПОЛУЧЕНИЕ ПАРАМЕТРОВ URL ===
            function getParams() {
                const q = new URLSearchParams(location.search);
                // Если cat нет, только тогда ставим 'solder', иначе оставляем как есть!
                let cat = q.get('cat') || 'solder';
                let sub = q.get('sub') || '';
                return { cat, sub };
            }

            function setParams({ cat, sub }) {
                const u = new URL(location.href);
                u.searchParams.set('cat', cat);
                if (sub) u.searchParams.set('sub', sub); else u.searchParams.delete('sub');
                history.replaceState(null, '', u);
            }

            let { cat, sub } = getParams();
            // Не вызываем setParams сразу, чтобы не ломать историю, если параметры верные

            // === 2. ДАННЫЕ О КАТЕГОРИЯХ (ИЗ API) ===
            // Нам нужно скачать список категорий, чтобы знать их красивые названия (title_ru/ua)
            let categoriesMap = [];

            try {
                const res = await fetch('/api/categories');
                const data = await res.json();
                if (data.success) {
                    categoriesMap = data.categories;
                }
            } catch (e) {
                console.error("Не удалось загрузить названия категорий", e);
            }

            // Поиск названия категории по её slug
            const getCatTitle = (slug) => {
                const langAttr = (document.documentElement.getAttribute('lang') || '').toLowerCase();
                const isUA = langAttr.startsWith('uk') || langAttr === 'ua' || location.pathname.includes('/ua/');

                const found = categoriesMap.find(c => c.slug === slug);
                if (!found) return slug; // Если не нашли, возвращаем сам slug (напр. 'new-cat')

                return isUA ? (found.title_ua || found.title_ru) : found.title_ru;
            };

            // Поиск подкатегорий для текущей категории
            const getSubcats = (parentSlug) => {
                const langAttr = (document.documentElement.getAttribute('lang') || '').toLowerCase();
                const isUA = langAttr.startsWith('uk') || langAttr === 'ua' || location.pathname.includes('/ua/');

                return categoriesMap
                    .filter(c => c.parent_slug === parentSlug)
                    .sort((a, b) => a.position - b.position)
                    .map(c => ({
                        slug: c.slug,
                        title: isUA ? (c.title_ua || c.title_ru) : c.title_ru
                    }));
            };

            // === 3. ЭЛЕМЕНТЫ UI ===
            const catTitle = document.getElementById('catTitle');
            const crumbCat = document.getElementById('crumbCat');
            const crumbSepSub = document.getElementById('crumbSepSub');
            const crumbSub = document.getElementById('crumbSub');
            const subnav = document.getElementById('subcats');

            const sortSelect = document.getElementById('sortSelect');
            const pageSizeSelect = document.getElementById('pageSizeSelect');
            const pager = document.getElementById('catalogPager');
            const grid = document.getElementById('catalogGrid');
            const btnGrid = document.getElementById('btnGrid');
            const btnList = document.getElementById('btnList');
            const catalogSec = document.getElementById('catalog');

            const PRODUCT_PAGE = 'product.html';

            function openProduct(pid) {
                if (!pid) return;
                const u = new URL(PRODUCT_PAGE, document.baseURI);
                u.searchParams.set('id', pid);
                if (cat) u.searchParams.set('cat', cat);
                if (sub) u.searchParams.set('sub', sub);
                location.href = u.pathname + u.search;
            }

            if (grid) {
                grid.addEventListener('click', (e) => {
                    if (e.target.closest('.product-card__buy')) return;
                    const card = e.target.closest('.product-card.is-clickable');
                    if (!card) return;
                    openProduct(card.dataset.id);
                });
            }

            // === 4. ОБНОВЛЕНИЕ ЗАГОЛОВКОВ ===
            function refreshHead() {
                const niceTitle = getCatTitle(cat);
                const subCatsList = getSubcats(cat);

                document.title = 'RadioBox — ' + niceTitle;
                catTitle.textContent = niceTitle;

                // Хлебные крошки
                crumbCat.innerHTML = '';
                if (subCatsList.length > 0 || sub) {
                    // Если есть подкатегории или мы в подкатегории -> делаем ссылку
                    const a = document.createElement('a');
                    a.href = `?cat=${encodeURIComponent(cat)}`;
                    a.textContent = niceTitle;
                    // Исправление бага с кликом
                    a.onclick = (e) => {
                        e.preventDefault();
                        sub = '';
                        setParams({cat, sub});
                        current = 1;
                        render();
                    };
                    crumbCat.appendChild(a);
                } else {
                    crumbCat.textContent = niceTitle;
                }

                // Панель подкатегорий (кнопки-овалы)
                if (subCatsList.length > 0) {
                    subnav.hidden = false;
                    subnav.innerHTML = '';
                    subCatsList.forEach(item => {
                        const a = document.createElement('a');
                        a.href = `?cat=${encodeURIComponent(cat)}&sub=${encodeURIComponent(item.slug)}`;
                        a.textContent = item.title;
                        if (sub === item.slug) a.setAttribute('aria-current', 'page');

                        a.onclick = (e) => {
                            e.preventDefault();
                            sub = item.slug;
                            setParams({cat, sub});
                            current = 1;
                            render();
                        }
                        subnav.appendChild(a);
                    });
                } else {
                    subnav.hidden = true;
                }

                // Крошка подкатегории
                if (sub) {
                    const subName = getCatTitle(sub); // Подкатегория тоже есть в общем списке
                    crumbSepSub.hidden = false;
                    crumbSub.hidden = false;
                    crumbSub.textContent = subName;
                } else {
                    crumbSepSub.hidden = true;
                    crumbSub.hidden = true;
                    crumbSub.textContent = '';
                }
            }

            // === 5. РАБОТА С ДАННЫМИ (LocalStorage) ===
            const langAttr = (document.documentElement.getAttribute('lang') || '').toLowerCase();
            const IS_UA = langAttr.startsWith('uk') || langAttr === 'ua' || /\/ua\//i.test(location.pathname);
            const IS_RU = langAttr.startsWith('ru') || /\/ru\//i.test(location.pathname);
            const LS_KEY = IS_UA ? 'rb_catalog_v1_ua' : IS_RU ? 'rb_catalog_v1_ru' : 'rb_catalog_v1';

            const loadItems = () => {
                try {
                    const s = localStorage.getItem(LS_KEY);
                    if (!s) return [];
                    const o = JSON.parse(s);
                    return Array.isArray(o?.items) ? o.items : [];
                } catch { return []; }
            };

            const fromLS = (k, d) => localStorage.getItem(k) || d;

            // Настройки просмотра
            const LS_PAGESIZE = 'rb_catalog_pagesize';
            const LS_SORT = 'rb_catalog_sort';
            const LS_VIEW = 'rb_catalog_view';

            let pageSize = parseInt(localStorage.getItem(LS_PAGESIZE) || 6);
            let current = 1;
            let sortMode = fromLS(LS_SORT, 'default');
            let view = fromLS(LS_VIEW, 'grid');

            pageSizeSelect.value = String(pageSize);
            sortSelect.value = sortMode;

            // Фильтрация
            function filterByCatSub(all) {
                // Главный фильтр по категории
                let arr = all.filter(p => p.category === cat);

                // Фильтр по подкатегории
                if (sub) {
                    arr = arr.filter(p => (p.subcategory || '') === sub);
                }

                return arr;
            }

            // Сортировка
            function sortItems(arr) {
                const c = arr.slice();
                if (sortMode === 'price_asc') return c.sort((a, b) => a.price - b.price);
                if (sortMode === 'price_desc') return c.sort((a, b) => b.price - a.price);
                return c;
            }

            // Пагинация
            const totalPages = arr => Math.max(1, Math.ceil(arr.length / pageSize));
            const slicePage = (arr, p) => arr.slice((p - 1) * pageSize, (p - 1) * pageSize + pageSize);

            function buildPager(total, current, neighbors = 1) {
                const pages = new Set([1, total]);
                for (let i = current - neighbors; i <= current + neighbors; i++) if (i > 1 && i < total) pages.add(i);
                const nums = [...pages].sort((a, b) => a - b);

                let html = '';
                // Стрелка назад
                const prevDisabled = current === 1;
                html += `<a href="#" data-page="${current - 1}" ${prevDisabled ? 'style="pointer-events:none;opacity:0.5"' : ''}>←</a>`;

                nums.forEach((p, i) => {
                    if (i > 0 && (p - nums[i - 1]) > 1) html += '<span>…</span>';
                    html += p === current ? `<a href="#" data-page="${p}" aria-current="page"><strong>${p}</strong></a>` : `<a href="#" data-page="${p}">${p}</a>`;
                });

                // Стрелка вперед
                const nextDisabled = current === total;
                html += `<a href="#" data-page="${current + 1}" ${nextDisabled ? 'style="pointer-events:none;opacity:0.5"' : ''}>→</a>`;

                return html;
            }

            // HTML Генераторы
            function gridCardHTML(p) {
                const stClass = p.in_stock ? 'is-instock' : 'is-out';
                const stText = p.in_stock ? (IS_UA ? 'В наявності' : 'В наличии') : (IS_UA ? 'Немає' : 'Нет в наличии');
                const btnText = IS_UA ? 'Купити' : 'Купить';

                return `
                <article class="product-card is-clickable" data-id="${p.id}" role="link" tabindex="0">
                  <div class="product-card__img"><img src="${p.image || ''}" alt="${p.title}"></div>
                  <h3 class="product-card__title">${p.title}</h3>
                  <div class="product-card__meta">Код: <span>${p.sku}</span></div>
                  <div class="product-card__price">${p.price} ₴</div>
                  <div class="product-card__status ${stClass}">${stText}</div>
                  <button class="product-card__buy" type="button" onclick="event.stopPropagation(); window.rbAddToCart(${p.id});">${btnText}</button>
                </article>`;
            }

            function listCardHTML(p) {
                const stClass = p.in_stock ? 'is-instock' : 'is-out';
                const stText = p.in_stock ? (IS_UA ? 'В наявності' : 'В наличии') : (IS_UA ? 'Немає' : 'Нет в наличии');
                const btnText = IS_UA ? 'Купити' : 'Купить';

                return `
                <article class="product-card product-card--list is-clickable" data-id="${p.id}" role="link" tabindex="0">
                  <div class="product-card__img"><img src="${p.image || ''}" alt="${p.title}"></div>
                  <div class="product-info">
                    <h3 class="product-card__title">${p.title}</h3>
                    <div class="product-card__price">${p.price} ₴</div>
                    <div class="product-card__status ${stClass}">${stText}</div>
                    <div class="product-meta-wrap">Код: <span>${p.sku}</span></div>
                  </div>
                  <div class="product-cta">
                    <button class="product-card__buy" type="button" onclick="event.stopPropagation(); window.rbAddToCart(${p.id});">${btnText}</button>
                  </div>
                </article>`;
            }

            function applyViewButtons() {
                btnGrid.classList.toggle('is-active', view === 'grid');
                btnList.classList.toggle('is-active', view === 'list');
                catalogSec.classList.toggle('list-view', view === 'list');
            }

            // === 6. ОСНОВНОЙ РЕНДЕР ===
            function render() {
                refreshHead();
                applyViewButtons();

                const all = loadItems();
                const filtered = filterByCatSub(all); // <-- Тут больше нет fallback'а на "все товары"
                const sorted = sortItems(filtered);
                const total = totalPages(sorted);
                if (current > total) current = total;

                // Пустое состояние
                if (sorted.length === 0) {
                    const catName = getCatTitle(cat);
                    grid.innerHTML = `
                        <div class="catalog-empty" style="text-align:center; padding:40px;">
                          ${IS_UA ? 'У цій категорії поки немає товарів.' : 'В этой категории пока нет товаров.'}
                          <br>
                          <a href="products.html" style="color:#0d2b4e; text-decoration:underline; margin-top:10px; display:inline-block;">
                            ${IS_UA ? 'Дивитись всі товари' : 'Смотреть все товары'}
                          </a>
                        </div>`;
                    pager.innerHTML = '';
                    return;
                }

                grid.innerHTML = slicePage(sorted, current).map(view === 'list' ? listCardHTML : gridCardHTML).join('');
                pager.innerHTML = total > 1 ? buildPager(total, current, 1) : '';

                // Обновляем боковые баннеры, если есть скрипт
                if (window.rbRefreshSideArt) window.rbRefreshSideArt();
            }

            // Публичный метод для вызова из других скриптов
            window.renderCatalog = render;

            // === 7. СОБЫТИЯ ===
            pager.addEventListener('click', e => {
                const a = e.target.closest('a[data-page]'); if (!a) return;
                e.preventDefault();
                const p = parseInt(a.dataset.page, 10); if (!Number.isFinite(p)) return;
                current = Math.max(1, p); render();
                catalogSec?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            pageSizeSelect.addEventListener('change', () => {
                pageSize = parseInt(pageSizeSelect.value, 10) || 6;
                localStorage.setItem(LS_PAGESIZE, String(pageSize));
                current = 1; render();
            });

            sortSelect.addEventListener('change', () => {
                sortMode = sortSelect.value || 'default';
                localStorage.setItem(LS_SORT, sortMode);
                current = 1; render();
            });

            btnGrid.addEventListener('click', () => {
                if (view === 'grid') return;
                view = 'grid'; localStorage.setItem(LS_VIEW, view); render();
            });
            btnList.addEventListener('click', () => {
                if (view === 'list') return;
                view = 'list'; localStorage.setItem(LS_VIEW, view); render();
            });

            window.addEventListener('popstate', () => {
                const p = getParams(); cat = p.cat; sub = p.sub; current = 1; render();
            });

            // ПЕРВЫЙ ЗАПУСК
            render();
        });
    </script>

    <div class="side-art side-art--right" data-src="../assets/photos/photos_left_right/right.jpg" aria-hidden="true"></div>

</body>
