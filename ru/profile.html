<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Личный кабинет — RadioBox</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../script.js" defer></script>
    <script src="//static.liqpay.ua/libjs/checkout.js"></script>
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="cab-container">

        <aside class="cab-sidebar">
            <div class="cab-user-name" id="profileName">Загрузка...</div>
            <div class="cab-user-email" id="profileEmail">...</div>

            <nav style="margin-top: 20px;">
                <button class="cab-menu-btn logout" id="btnLogout">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="margin-right:8px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Выйти
                </button>
            </nav>
        </aside>

        <main class="cab-content">
            <div class="cab-controls">
                <h2>История заказов</h2>
                <select class="cab-sort-select" id="sortOrders">
                    <option value="newest">Сначала новые</option>
                    <option value="oldest">Сначала старые</option>
                </select>
            </div>

            <div id="ordersList">
                <div style="text-align:center; padding: 40px; color:#64748b;">Загрузка заказов...</div>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>

    <div id="liqpay_checkout"></div>
</body>
</html>
