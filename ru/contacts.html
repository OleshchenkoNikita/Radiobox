<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RadioBox — Контакты</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="preload" as="image" href="../assets/icons/viber_under_cursor.png">

  <!-- Локальные мини-стили только для таблицы контактов -->
  <style>
    .contacts-page { margin-top: 0; }
    .contacts__title { composes: groups__title; } /* если препроцессора нет, просто используем .groups__title ниже */
    .contacts-table{
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      color:#0f172a;
      margin-top: 10px;
    }
    .contacts-table tbody tr { border-bottom:1px solid #eef1f5; }
    .contacts-table th,
    .contacts-table td{
      padding:10px 12px;
      text-align: left;
      vertical-align: top;
    }
    .contacts-table th{
      width: 220px;           /* колонка меток */
      color:#6b7280;
      font-weight:700;
      letter-spacing:.02em;
    }
    .contacts-table a{
      color:inherit;
      text-decoration:underline;
      text-underline-offset:2px;
    }
    .contacts-table .stack{ display:flex; flex-direction:column; gap:4px; }
  </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <!-- Двухколоночная область -->
    <section class="home-layout container">
        <!-- Левая колонка (меню как на других страницах) -->
        <div id="sidebar-placeholder"></div>

        <!-- Правая колонка (контент) -->
        <div class="home-right">

            <!-- Хлебные крошки -->
            <nav class="breadcrumbs" aria-label="Хлебные крошки">
                <a class="crumb-home" href="index.html" aria-label="Главная">🏠</a>
                <span class="crumb-sep" aria-hidden="true">›</span>
                <a class="crumb-current" href="contacts.html" aria-current="page">Контакты</a>
            </nav>

            <!-- Контакты: таблица -->
            <section class="contacts-page">
                <h2 class="groups__title">Контакты</h2>

                <table class="contacts-table" aria-describedby="contacts-info">
                    <tbody>
                        <tr>
                            <th scope="row">Название:</th>
                            <td>Интернет-магазин «RadioBox»</td>
                        </tr>
                        <tr>
                            <th scope="row">Контактное лицо:</th>
                            <td>Сергей Бугаенко</td>
                        </tr>
                        <tr><th scope="row">Адрес:</th><td id="page-address">г. Шостка, Украина</td></tr>
                        <tr>
                            <th scope="row">Сайт компании:</th>
                            <td><a href="https://radiobox.in.ua/" target="_blank" rel="noopener">https://radiobox.in.ua/</a></td>
                        </tr>
                        <tr>
                            <th scope="row">Телефон:</th>
                            <td id="page-phones-list" class="stack"></td>
                        </tr>
                        <tr>
                            <th scope="row">Email:</th>
                            <td><a href="mailto:pulya133@gmail.com">pulya133@gmail.com</a></td>
                        </tr>
                        <tr>
                            <th scope="row">Viber:</th>
                            <td><a href="viber://chat?number=%2B380930728887">+380930728887</a></td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </section>

    <!-- Плавающая кнопка Viber -->
    <a class="float-viber"
       href="viber://chat?number=%2B380930728887"
       aria-label="Открыть чат в Viber"
       title="Открыть чат в Viber">
        <img class="vb vb--idle" src="../assets/icons/viber_without_cursor.png" alt="Viber" width="44" height="44">
        <img class="vb vb--hover" src="../assets/icons/viber_under_cursor.png" alt="" aria-hidden="true" width="44" height="44">
    </a>

    <div id="footer-placeholder"></div>

    <script src="../script.js" defer></script>

    <!-- Боковые картинки (повторяющиеся, высота считается автоматически) -->
    <div class="side-art side-art--left" data-src="../assets/photos/photos_left_right/left.jpg" aria-hidden="true"></div>
    <div class="side-art side-art--right" data-src="../assets/photos/photos_left_right/right.jpg" aria-hidden="true"></div>

</body>
</html>
