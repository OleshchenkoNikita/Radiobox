<!doctype html>
<html lang="ru">
<head>

    {% if gtm_id %}
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','{{ gtm_id }}');</script>
  <!-- End Google Tag Manager -->
  {% endif %}

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadioBox — Отзывы</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="preload" as="image" href="../assets/icons/viber_under_cursor.png">
</head>
<body>

    {% if gtm_id %}
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ gtm_id }}"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  {% endif %}

    <div id="header-placeholder"></div>

    <!-- Двухколоночная область -->
    <section class="home-layout container">
        <!-- Левая колонка -->
        <div id="sidebar-placeholder"></div>

        <!-- Правая колонка -->
        <div class="home-right">

            <!-- Хлебные крошки -->
            <nav class="breadcrumbs" aria-label="Хлебные крошки">
                <a class="crumb-home" href="index.html" aria-label="Главная">🏠</a>
                <span class="crumb-sep" aria-hidden="true">›</span>
                <a class="crumb-current" href="reviews.html" aria-current="page">Отзывы</a>
            </nav>

            <!-- Контент: список отзывов -->
            <section class="reviews-page">
                <h2 class="groups__title">Отзывы</h2>

                <div class="reviews-actions">
                    <a class="btn-add-review" href="#" title="Оставить отзыв">Оставить отзыв</a>
                </div>

                <!-- Форма добавления отзыва -->
                <form id="reviewForm" class="review-form" hidden novalidate>
                    <!-- Ряд: ФИ + рейтинг -->
                    <div class="rf-row">
                        <label class="rf-name">
                            <span class="rf-label">Имя и фамилия</span>
                            <input id="rfName" type="text" name="author" maxlength="120" placeholder="Ваше имя и фамилия">
                            <small class="rf-error" id="errName" aria-live="polite"></small>
                        </label>

                        <fieldset class="rf-rating">
                            <legend class="rf-label">Оценка</legend>
                            <div class="stars" role="radiogroup" aria-label="Оценка">
                                <!-- 5..1 чтобы звёзды шли слева-направо как обычно -->
                                <input type="radio" id="star5" name="rating" value="5">
                                <label for="star5" aria-label="5">★</label>
                                <input type="radio" id="star4" name="rating" value="4">
                                <label for="star4" aria-label="4">★</label>
                                <input type="radio" id="star3" name="rating" value="3">
                                <label for="star3" aria-label="3">★</label>
                                <input type="radio" id="star2" name="rating" value="2">
                                <label for="star2" aria-label="2">★</label>
                                <input type="radio" id="star1" name="rating" value="1">
                                <label for="star1" aria-label="1">★</label>
                            </div>
                            <small class="rf-error" id="errRating" aria-live="polite"></small>
                        </fieldset>
                    </div>

                    <!-- Комментарий + счётчик -->
                    <div class="rf-row rf-comment-row">
                        <label class="rf-comment">
                            <span class="rf-label">Комментарий (необязательно)</span>
                            <textarea id="rfComment" name="comment" maxlength="300" rows="4" placeholder="Ваш отзыв (до 300 символов)"></textarea>
                        </label>
                        <div class="rf-count"><span id="rfCnt">0</span>/300</div>
                    </div>

                    <!-- Кнопки -->
                    <div class="rf-actions">
                        <button type="submit" class="rf-btn rf-btn--primary">Сохранить</button>
                        <button type="button" class="rf-btn rf-btn--ghost" id="rfCancel">Отменить</button>
                    </div>
                </form>

                <div id="revList" class="rev-list" aria-live="polite"></div>
                <div class="rev-pager" id="revPager"></div>
            </section>

        </div>
    </section>

    <!-- Плавающая кнопка Viber -->
    <a class="float-viber" href="viber://chat?number=%2B380930728887" aria-label="Открыть чат в Viber" title="Открыть чат в Viber">
        <img class="vb vb--idle" src="../assets/icons/viber_without_cursor.png" alt="Viber" width="44" height="44">
        <img class="vb vb--hover" src="../assets/icons/viber_under_cursor.png" alt="" aria-hidden="true" width="44" height="44">
    </a>

    <div id="footer-placeholder"></div>

    <!-- Боковые картинки (повторяющиеся, высота считается автоматически) -->
    <div class="side-art side-art--left" data-src="../assets/photos/photos_left_right/left.jpg" aria-hidden="true"></div>
    <div class="side-art side-art--right" data-src="../assets/photos/photos_left_right/right.jpg" aria-hidden="true"></div>

    <script src="../script.js" defer></script>
</body>
</html>
