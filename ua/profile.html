<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Особистий кабінет — RadioBox</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../script.js" defer></script>
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="cab-container">

        <aside class="cab-sidebar">
            <div class="cab-user-name" id="profileName">Завантаження...</div>
            <div class="cab-user-email" id="profileEmail">...</div>

            <nav style="margin-top: 20px;">
                <button class="cab-menu-btn logout" id="btnLogout">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="margin-right:8px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Вийти
                </button>
            </nav>
        </aside>

        <main class="cab-content">
            <div class="cab-controls">
                <h2>Історія замовлень</h2>
                <select class="cab-sort-select" id="sortOrders">
                    <option value="newest">Спочатку нові</option>
                    <option value="oldest">Спочатку старі</option>
                </select>
            </div>

            <div id="ordersList">
                <div style="text-align:center; padding: 40px; color:#64748b;">Завантаження замовлень...</div>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>

    <div class="modal-overlay" id="historyPayModal">
        <div class="pay-modal">
            <button type="button" class="modal-close" onclick="closePayModal()">&times;</button>
            <h3 style="margin-top:0; margin-bottom:20px; text-align:center;">Оплата заказа</h3>
            <p id="payModalOrderNum" style="text-align:center; color:#666; font-size:14px; margin-bottom:15px;">Заказ №...</p>
            <div class="modal-field">
                <label>Номер карты</label>
                <input type="text" class="modal-input" id="histCardNum" placeholder="0000 0000 0000 0000" maxlength="19">
            </div>
            <div class="modal-row">
                <div class="modal-field">
                    <label>Срок (MM/YY)</label>
                    <input type="text" class="modal-input" id="histCardDate" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="modal-field">
                    <label>CVV</label>
                    <input type="password" class="modal-input" id="histCardCvv" placeholder="123" maxlength="3">
                </div>
            </div>
            <button type="button" class="btn-modal-pay" id="histDoPayBtn">Оплатить <span id="histPaySum">0</span> ₴</button>
        </div>
    </div>

</body>
</html>
