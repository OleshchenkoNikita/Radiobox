<!DOCTYPE html>
<html lang="uk">
<head>

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-NLXR4MGP');</script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результати пошуку | RadioBox</title>

    <link rel="stylesheet" href="/styles.css">

    <style>
        /* Дополнительные стили для верстки страницы поиска */
        .page-layout {
            display: flex;
            gap: 30px;
            margin-top: 30px;
            margin-bottom: 50px;
            align-items: flex-start;
        }

        /* Место под сайдбар (размер как в каталоге) */
        #sidebar-placeholder {
            width: 260px;
            flex-shrink: 0;
        }

        /* Основная колонка с результатами */
        .search-content {
            flex-grow: 1;
            min-width: 0; /* Чтобы сетка не разрывала контейнер */
        }

        .search-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            color: #0f172a;
            font-weight: 800;
        }

        .search-query-text {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 16px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Сетка товаров */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .no-results-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
            font-size: 18px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }

        /* Адаптив для мобильных: одна колонка, сайдбар скрыт */
        @media (max-width: 991px) {
            .page-layout { flex-direction: column; gap: 20px; }
            #sidebar-placeholder { display: none; } /* Скрываем сайдбар на мобильных */
        }
    </style>
</head>
<body>

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NLXR4MGP"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="header-placeholder"></div>

    <div class="container page-layout">
        <aside id="sidebar-placeholder"></aside>

        <main class="search-content">
            <h1 class="search-title">Результати пошуку</h1>
            <div id="search-query-display" class="search-query-text"></div>

            <div id="results-wrapper" class="results-grid">
                <div style="grid-column: 1/-1; text-align: center; padding: 40px;">Завантаження...</div>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>

    <script src="/script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Получаем параметр ?q= из адресной строки
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');

            const wrapper = document.getElementById('results-wrapper');
            const titleDisplay = document.getElementById('search-query-display');

            // Если запрос пустой
            if (!query || query.trim().length < 2) {
                titleDisplay.textContent = 'Будь ласка, введіть запит у рядок пошуку.';
                wrapper.innerHTML = '';
                return;
            }

            titleDisplay.textContent = `Ви шукали: «${query}»`;

            try {
                // 2. Отправляем запрос на Python сервер
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                wrapper.innerHTML = '';

                if (data.success && data.results.length > 0) {
                    const listName = 'Результати пошуку';

                    // 1. Формируем и отправляем событие просмотра списка (view_item_list)
                    const ga4ListItems = data.results.map((item, idx) => {
                        const title = item.title_ua || item.title_ru || 'Товар';
                        return {
                            item_id: String(item.sku || item.id),
                            item_name: title,
                            price: parseFloat(item.price || 0),
                            item_category: item.category || 'general',
                            item_list_id: 'search_results_page',
                            item_list_name: listName,
                            index: idx + 1
                        };
                    });

                    if (typeof pushGA4Event === 'function') {
                        pushGA4Event('view_item_list', ga4ListItems);
                    }

                    // 2. Рендерим карточки товаров и вешаем события клика
                    data.results.forEach((item, idx) => {
                        const title = item.title_ua || item.title_ru || 'Товар';
                        const img = (item.images && item.images.length > 0) ? item.images[0] : (item.image || '/assets/icons/company.png');

                        const stockClass = item.in_stock ? 'is-instock' : 'is-out';
                        const stockText = item.in_stock ? 'В наявності' : 'Немає';
                        const btnText = 'Купити';

                        const link = document.createElement('a');
                        link.href = `product.html?id=${item.id}`;
                        link.className = 'product-card is-clickable';
                        link.innerHTML = `
                            <div class="product-card__img">
                                 <img src="${img}" alt="${title}" loading="lazy">
                            </div>
                            <h3 class="product-card__title">${title}</h3>
                            <div class="product-card__meta">Арт: <span>${item.sku || '-'}</span></div>
                            <div class="product-card__price">${item.price} ₴</div>
                            <div class="product-card__status ${stockClass}">${stockText}</div>
                            ${item.in_stock
                                ? `<button class="product-card__buy" type="button" onclick="event.stopPropagation(); window.rbAddToCart(${item.id});">${btnText}</button>`
                                : `<div style="color:#dc2626; font-size:14px; font-weight:bold; text-align:center; padding: 6px 0;">${stockText}</div>`
                            }
                        `;

                        // Отправка select_item при клике
                        link.addEventListener('click', (e) => {
                            // Не блокируем клик по кнопке "Купить"
                            if (e.target.closest('.product-card__buy')) return;

                            e.preventDefault();
                            if (typeof pushGA4Event === 'function') {
                                pushGA4Event('select_item', [{
                                    item_id: String(item.sku || item.id),
                                    item_name: title,
                                    price: parseFloat(item.price || 0),
                                    item_category: item.category || 'general',
                                    item_list_id: 'search_results_page',
                                    item_list_name: listName,
                                    index: idx + 1
                                }]);
                            }
                            setTimeout(() => { window.location.href = link.href; }, 150);
                        });

                        wrapper.appendChild(link);
                    });
                } else {
                    wrapper.innerHTML = '<div class="no-results-msg">На жаль, нічого не знайдено. Спробуйте змінити запит.</div>';
                }

            } catch (error) {
                console.error(error);
                wrapper.innerHTML = '<div style="color:red; padding:20px; text-align:center;">Помилка з\'єднання із сервером.</div>';
            }
        });

        // === ВАЖНОЕ ИСПРАВЛЕНИЕ: ПРИНУДИТЕЛЬНАЯ ИНИЦИАЛИЗАЦИЯ ХЕДЕРА ===
        // Это лечит проблему, когда кнопка "График работы" не открывала модалку,
        // потому что скрипт загружался раньше, чем HTML хедера.
        window.addEventListener('load', () => {
            // Даем небольшую задержку (300мс), чтобы fetch('components/header.html') точно успел вставить HTML
            setTimeout(() => {
                if (window.initHeaderInteractivity) {
                    console.log("Force re-init header logic...");
                    window.initHeaderInteractivity();
                }
            }, 300);
        });
    </script>
</body>
</html>
