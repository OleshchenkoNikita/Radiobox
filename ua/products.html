<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadioBox — Товари</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
        /* Кнопки переключення виду */
        .view-btn {
            border: 1px solid #d7dbe3;
            background: #fff;
            border-radius: 8px;
            padding: 6px 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            line-height: 1;
        }

            .view-btn svg {
                width: 18px;
                height: 18px;
                display: block
            }

            .view-btn.is-active {
                background: #0d2b4e;
                color: #fff;
                border-color: #0d2b4e
            }

        /* Списковий вид */
        #catalog.list-view .showcase__grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card--list {
            display: grid;
            grid-template-columns: 140px 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #e6e8ed;
            border-radius: 12px;
        }

            .product-card--list .product-card__img {
                width: 140px
            }

                .product-card--list .product-card__img img {
                    width: 120px;
                    height: auto;
                    object-fit: contain
                }

            .product-card--list .product-info {
                min-width: 0
            }

            .product-card--list .product-card__title {
                margin: 0 0 8px;
                font-size: 16px
            }

            .product-card--list .product-card__price {
                font-size: 20px;
                font-weight: 700;
                margin: 0 0 4px
            }

            .product-card--list .product-card__status {
                margin: 0 0 6px
            }

            .product-card--list .product-meta-wrap {
                font-size: 13px;
                color: #6b7280
            }

            .product-card--list .product-cta {
                justify-self: end
            }

            .product-card--list .product-card__buy {
                min-width: 120px
            }
    </style>

    <link rel="preload" as="image" href="../assets/icons/viber_under_cursor.png">
</head>
<body>

    <div id="header-placeholder"></div>

    <!-- ===== Двоколонкова область ===== -->
    <section class="home-layout container">
        <!-- Ліва колонка -->
        <div id="sidebar-placeholder"></div>

        <!-- Права колонка -->
        <div class="home-right" data-side-watch>
            <!-- Хлібні крихти -->
            <nav class="breadcrumbs" aria-label="Хлібні крихти">
                <a class="crumb-home" href="index.html" aria-label="Головна">🏠</a>
                <span class="crumb-sep" aria-hidden="true">›</span>
                <a class="crumb-current" href="products.html" aria-current="page">Товари</a>
            </nav>

            <!-- Групи товарів -->
            <section class="groups" id="groups">
                <h2 class="groups__title">Групи товарів</h2>
                <div class="groups__grid">
                    <a href="type_of_product.html?cat=solder" class="group-card" id="cat-solder">
                        <div class="group-card__img"><img src="../assets/photos/groups_of_products/payalnoe-oborudovanie.png" alt="Паяльне обладнання"></div>
                        <div class="group-card__title">ПАЯЛЬНЕ ОБЛАДНАННЯ</div>
                    </a>
                    <a href="type_of_product.html?cat=repair" class="group-card">
                        <div class="group-card__img"><img src="../assets/photos/groups_of_products/vse-dlya-remonta.png" alt="Все для ремонту, тестери, інструменти"></div>
                        <div class="group-card__title">ВСЕ ДЛЯ РЕМОНТУ, ТЕСТЕРИ, ІНСТРУМЕНТИ</div>
                    </a>
                    <a href="type_of_product.html?cat=consum" class="group-card">
                        <div class="group-card__img"><img src="../assets/photos/groups_of_products/raskhodnye-materialy.png" alt="Витратні матеріали"></div>
                        <div class="group-card__title">ВИТРАТНІ МАТЕРІАЛИ</div>
                    </a>
                    <a href="type_of_product.html?cat=osc" class="group-card">
                        <div class="group-card__img"><img src="../assets/photos/groups_of_products/oscillografy.png" alt="Осцилографи"></div>
                        <div class="group-card__title">ОСЦИЛОГРАФИ</div>
                    </a>
                    <a href="type_of_product.html?cat=prog" class="group-card">
                        <div class="group-card__img"><img src="../assets/photos/groups_of_products/programmatory.png" alt="Програматори"></div>
                        <div class="group-card__title">ПРОГРАМАТОРИ</div>
                    </a>
                    <a href="type_of_product.html?cat=meas" class="group-card">
                        <div class="group-card__img"><img src="../assets/photos/groups_of_products/izmeritelnye-pribory.png" alt="Вимірювальні прилади"></div>

                    </a>
                    <a href="type_of_product.html?cat=rmods" class="group-card">

                        <div class="group-card__title">РАДІОМОДУЛІ</div>
                    </a>
                    <a href="type_of_product.html?cat=rparts" class="group-card">
                        <div class="group-card__img"><img src="../assets/photos/groups_of_products/radiodetali.png" alt="Радіодеталі"></div>
                        <div class="group-card__title">РАДІОДЕТАЛІ</div>
                    </a>
                    <a href="type_of_product.html?cat=cables" class="group-card">
                        <div class="group-card__img"><img src="../assets/photos/groups_of_products/kabeli-razemy-shtekery.png" alt="Кабелі, роз’єми, штекери"></div>
                        <div class="group-card__title">КАБЕЛІ, РОЗ’ЄМИ, ШТЕКЕРИ</div>

                    <a href="type_of_product.html?cat=psu" class="group-card">

            <!-- Вітрина -->
            <section class="showcase" id="catalog" data-side-watch>
                <!-- Панель керування -->
                <div class="rf-row" style="justify-content:flex-start; gap:16px; margin:0 0 12px;">
                    <label style="font-size:13px; color:#374151;">
                        Сортування:
                        <select id="sortSelect" style="border:1px solid #d7dbe3; border-radius:8px; padding:6px 8px; margin-left:6px;">
                            <option value="default" selected>за замовчуванням</option>
                            <option value="price_asc">ціна ↑</option>
                            <option value="price_desc">ціна ↓</option>
                        </select>
                    </label>

                    <div role="group" aria-label="Вид" style="margin-left:auto; display:flex; align-items:center; gap:8px;">
                        <button id="btnGrid" type="button" class="view-btn is-active" aria-pressed="true" title="Сітка">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" /></svg>
                            Сітка
                        </button>
                        <button id="btnList" type="button" class="view-btn" aria-pressed="false" title="Список">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z" /></svg>
                            Список
                        </button>
                    </div>
                </div>

                <div id="catalogGrid" class="showcase__grid" aria-live="polite"></div>

                <!-- Низ вітрини -->
                <div class="rf-row" style="align-items:center; justify-content:space-between; margin-top:12px;">
                    <label style="font-size:13px; color:#374151;">
                        Товарів на сторінці:
                        <select id="pageSizeSelect" style="border:1px solid #d7dbe3; border-radius:8px; padding:6px 8px; margin-left:6px;">
                            <option value="6" selected>6</option>
                            <option value="12">12</option>
                            <option value="24">24</option>
                        </select>
                    </label>

                    <nav id="catalogPager" class="rev-pager" aria-label="Сторінки каталогу"></nav>
                </div>
            </section>

            <!-- !!! ВИДЖЕТ ИСТОРИИ !!! -->
            <div id="viewed-widget" style="margin-top: 40px;"></div>

        </div>
    </section>

    <!-- Плаваюча кнопка Viber -->
    <a class="float-viber" href="viber://chat?number=%2B380930728887" aria-label="Відкрити чат у Viber" title="Відкрити чат у Viber">
        <img class="vb vb--idle" src="../assets/icons/viber_without_cursor.png" alt="Viber" width="44" height="44">
        <img class="vb vb--hover" src="../assets/icons/viber_under_cursor.png" alt="" aria-hidden="true" width="44" height="44">
    </a>

    <div id="footer-placeholder"></div>

    <!-- загальний скрипт сайту -->
    <script src="../script.js" defer></script>

    <!-- ===== Сценарій вітрини (окремий LS для UA) ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ОКРЕМИЙ ключ для української версії
            const LS_KEY = 'rb_catalog_v1_ua';
            // Ці можна лишити спільними, щоб зберігались налаштування відображення
            const LS_PAGESIZE = 'rb_catalog_pagesize';
            const LS_SORT = 'rb_catalog_sort';
            const LS_VIEW = 'rb_catalog_view';

            const CATS = [
                ['solder', 'Паяльне обладнання'],
                ['repair', 'Все для ремонту, тестери, інструменти'],
                ['consum', 'Витратні матеріали'],
                ['osc', 'Осцилографи'],
                ['prog', 'Програматори'],
                ['meas', 'Вимірювальні прилади'],
                ['rmods', 'Радіомодулі'],
                ['rparts', 'Радіодеталі'],
                ['cables', 'Кабелі, роз’єми, штекери'],
                ['psu', 'Джерела живлення']
            ];

            // ==== helpers (LS) ====
            const loadItems = () => {
                try {
                    const s = localStorage.getItem(LS_KEY);
                    if (!s) return [];
                    const obj = JSON.parse(s);
                    return Array.isArray(obj?.items) ? obj.items : [];
                } catch { return []; }
            };
            const saveItems = (items) => { try { localStorage.setItem(LS_KEY, JSON.stringify({ items })); } catch { } };

            // ==== елементи UI ====
            const sortSelect = document.getElementById('sortSelect');
            const pageSizeSelect = document.getElementById('pageSizeSelect');
            const pager = document.getElementById('catalogPager');
            const grid = document.getElementById('catalogGrid');
            const btnGrid = document.getElementById('btnGrid');
            const btnList = document.getElementById('btnList');
            const catalogSection = document.getElementById('catalog');

            const fromLSint = (k, def) => {
                const v = localStorage.getItem(k); const n = v == null ? NaN : parseInt(v, 10);
                return Number.isFinite(n) && n > 0 ? n : def;
            };
            const fromLS = (k, def) => localStorage.getItem(k) || def;

            // ==== стан ====
            const hashCat = (location.hash || '').replace(/^#cat-/, '');
            const allItems = loadItems();
            let items = (hashCat && allItems.some(p => p.category === hashCat))
                ? allItems.filter(p => p.category === hashCat)
                : allItems;

            let pageSize = fromLSint(LS_PAGESIZE, 6);
            let current = 1;
            let sortMode = fromLS(LS_SORT, 'default');
            let view = fromLS(LS_VIEW, 'grid'); // 'grid' | 'list'

            pageSizeSelect.value = String(pageSize);
            sortSelect.value = sortMode;

            // ==== сортування ====
            const by = (k) => (a, b) => (a[k] < b[k] ? -1 : a[k] > b[k] ? 1 : 0);
            function sortItems(arr) {
                const copy = arr.slice();
                if (sortMode === 'price_asc') return copy.sort(by('price'));
                if (sortMode === 'price_desc') return copy.sort((a, b) => b.price - a.price);
                return copy;
            }

            // ==== пагінація (із «сусідами») ====
            const totalPages = (arr) => Math.max(1, Math.ceil(arr.length / pageSize));
            const slicePage = (arr, p) => arr.slice((p - 1) * pageSize, (p - 1) * pageSize + pageSize);

            function buildPager(total, current, neighbors = 1) {
                const pages = new Set([1, total]);
                for (let i = current - neighbors; i <= current + neighbors; i++)
                    if (i > 1 && i < total) pages.add(i);
                const nums = [...pages].sort((a, b) => a - b);

                let html = link(current - 1, '←', current === 1);
                nums.forEach((p, i) => {
                    if (i > 0 && (p - nums[i - 1]) > 1) html += `<span>…</span>`;
                    html += p === current
                        ? `<a href="#" data-page="${p}" aria-current="page"><strong>${p}</strong></a>`
                        : `<a href="#" data-page="${p}">${p}</a>`;
                });
                html += link(current + 1, '→', current === total);
                return html;

                function link(p, label, dis) {
                    return `<a href="#" data-page="${p}" aria-label="${label}" ${dis ? 'aria-disabled="true" style="pointer-events:none;opacity:.4;"' : ''}>${label}</a>`;
                }
            }

            // ==== картки ====
            function gridCardHTML(p) {
                // Определяем язык прямо здесь
                const isUA = document.documentElement.lang === 'uk' || window.location.pathname.includes('/ua/');

                const stClass = p.in_stock ? 'is-instock' : 'is-out';
                const stText = p.in_stock
                    ? (isUA ? 'В наявності' : 'В наличии')
                    : (isUA ? 'Немає' : 'Нет в наличии');
                const btnText = isUA ? 'Купити' : 'Купить';

                // Текст количества
                const txtStock = isUA ? 'На складі:' : 'На складе:';
                const uLabel = (p.unit_type === 'set') ? (isUA ? 'комплект.' : 'комплект.') : (isUA ? 'шт.' : 'шт.');

                const qtyInfo = p.in_stock
                    ? `<div style="font-size:12px; color:#6b7280; margin-top:3px;">${txtStock} <b>${p.qty_stock}</b> ${uLabel}</div>`
                    : '';

                return `
                <article class="product-card is-clickable" data-id="${p.id}" role="link" tabindex="0">
                  <div class="product-card__img"><img src="${p.image || ''}" alt="${p.title}"></div>
                  <h3 class="product-card__title">${p.title}</h3>
                  <div class="product-card__meta">Код: <span>${p.sku}</span></div>
                  <div class="product-card__price">${p.price} ₴</div>
                  <div class="product-card__status ${stClass}">${stText}</div>
                  ${qtyInfo}
                  <button class="product-card__buy" type="button" onclick="event.stopPropagation(); window.rbAddToCart(${p.id});">${btnText}</button>
                </article>`;
            }

            function listCardHTML(p) {
                const isUA = document.documentElement.lang === 'uk' || window.location.pathname.includes('/ua/');

                const stClass = p.in_stock ? 'is-instock' : 'is-out';
                const stText = p.in_stock
                    ? (isUA ? 'В наявності' : 'В наличии')
                    : (isUA ? 'Немає' : 'Нет в наличии');
                const btnText = isUA ? 'Купити' : 'Купить';

                const txtLeft = isUA ? 'Залишок:' : 'Остаток:';
                const qtyInfo = p.in_stock
                    ? `<div style="font-size:13px; color:#666; margin-top:4px;">${txtLeft} <b>${p.qty_stock}</b> шт.</div>`
                    : '';

                return `
                <article class="product-card product-card--list is-clickable" data-id="${p.id}" role="link" tabindex="0">
                  <div class="product-card__img"><img src="${p.image || ''}" alt="${p.title}"></div>
                  <div class="product-info">
                    <h3 class="product-card__title">${p.title}</h3>
                    <div class="product-card__price">${p.price} ₴</div>
                    <div class="product-card__status ${stClass}">
                        ${stText}
                        ${qtyInfo}
                    </div>
                    <div class="product-meta-wrap">Код: <span>${p.sku}</span></div>
                  </div>
                  <div class="product-cta">
                    <button class="product-card__buy" type="button" onclick="event.stopPropagation(); window.rbAddToCart(${p.id});">${btnText}</button>
                  </div>
                </article>`;
            }

            // ==== рендер ====
            function applyViewButtons() {
                btnGrid.classList.toggle('is-active', view === 'grid');
                btnGrid.setAttribute('aria-pressed', view === 'grid');
                btnList.classList.toggle('is-active', view === 'list');
                btnList.setAttribute('aria-pressed', view === 'list');
                catalogSection.classList.toggle('list-view', view === 'list');
            }

            function render() {
                applyViewButtons();
                const sorted = sortItems(items);
                const total = totalPages(sorted);
                if (current > total) current = total;

                grid.innerHTML = slicePage(sorted, current).map(view === 'list' ? listCardHTML : gridCardHTML).join('');
                pager.innerHTML = total > 1 ? buildPager(total, current, 1) : '';
                // підправляємо бокові фони, якщо скрипт є
                window.rbRefreshSideArt && window.rbRefreshSideArt();
            }

            window.renderCatalog = () => {
                // 1. Принудительно читаем свежие данные из LocalStorage
                const freshAllItems = loadItems();

                // 2. Заново применяем фильтр категории (если он есть в URL)
                const currentCat = (location.hash || '').replace(/^#cat-/, '');

                if (currentCat && freshAllItems.some(p => p.category === currentCat)) {
                    items = freshAllItems.filter(p => p.category === currentCat);
                } else {
                    items = freshAllItems;
                }

                // 3. Вызываем рендер уже с новыми переменными
                render();
            };

            // ==== події ====
            pager.addEventListener('click', (e) => {
                const a = e.target.closest('a[data-page]'); if (!a) return;
                e.preventDefault();
                const p = parseInt(a.dataset.page, 10); if (!Number.isFinite(p)) return;
                const total = totalPages(items);
                current = Math.min(Math.max(1, p), total);
                render();
                catalogSection?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            pageSizeSelect.addEventListener('change', () => {
                pageSize = parseInt(pageSizeSelect.value, 10) || 6;
                localStorage.setItem(LS_PAGESIZE, String(pageSize));
                current = 1; render();
            });

            sortSelect.addEventListener('change', () => {
                sortMode = sortSelect.value || 'default';
                localStorage.setItem(LS_SORT, sortMode);
                current = 1; render();
            });

            btnGrid.addEventListener('click', () => {
                if (view === 'grid') return;
                view = 'grid'; localStorage.setItem(LS_VIEW, view); render();
            });
            btnList.addEventListener('click', () => {
                if (view === 'list') return;
                view = 'list'; localStorage.setItem(LS_VIEW, view); render();
            });

            // зміна категорії з hash
            window.addEventListener('hashchange', () => {
                const cat = (location.hash || '').replace(/^#cat-/, '');
                const all = loadItems();
                items = (cat && all.some(p => p.category === cat)) ? all.filter(p => p.category === cat) : all;
                current = 1; render();
            });

            grid.addEventListener('click', (e) => {
            // 1. Если кликнули на кнопку "Купити" — ничего не делаем (пусть работает корзина)
            if (e.target.closest('.product-card__buy')) return;

            // 2. Ищем карточку
            const card = e.target.closest('.product-card');
            if (card && card.dataset.id) {
                // 3. Переходим на страницу товара
                window.location.href = `product.html?id=${card.dataset.id}`;
                }
            });

            // старт
            render();
        });
    </script>

    <!-- Бокові картинки -->
    <div class="side-art side-art--left" data-src="../assets/photos/photos_left_right/left.jpg" aria-hidden="true"></div>
    <div class="side-art side-art--right" data-src="../assets/photos/photos_left_right/right.jpg" aria-hidden="true"></div>

</body>
