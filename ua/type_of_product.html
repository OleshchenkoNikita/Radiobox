        /* Кнопки переключення виду */

            border: 1px solid #d7dbe3;

        #catalog.list-view .showcase__grid {
            display: flex;

        .product-card--list {
            display: grid;
            grid-template-columns: 140px 1fr auto;
            gap: 16px;

            border: 1px solid #e6e8ed;

        }

            .product-card--list .product-card__img {
                width: 140px
            }

                .product-card--list .product-card__img img {

            .product-card--list .product-info {
                min-width: 0
            }

            .product-card--list .product-card__title {

                font-size: 16px

            .product-card--list .product-card__price {
                font-size: 20px;

                margin: 0 0 4px
            }

            .product-card--list .product-card__status {
                margin: 0 0 6px
            }

            .product-card--list .product-meta-wrap {
                font-size: 13px;
                color: #6b7280
            }

            .product-card--list .product-cta {
                justify-self: end
            }

            .product-card--list .product-card__buy {
                min-width: 120px
            }
        /* Піднавігація підкатегорій */
        .subcats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 14px
        }

            .subcats a {
                display: inline-block;
                padding: 6px 10px;
                border: 1px solid #d7dbe3;
                border-radius: 999px;
                background: #fff;
                text-decoration: none;
                color: #0f172a;
                font-size: 13px
            }

                .subcats a[aria-current="page"] {
                    background: #0d2b4e;
                    border-color: #0d2b4e;
                    color: #fff
                }
        /* FB кнопка для “meas” */
        .social-btn {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            background: #fff;
            border: 1px solid #e6e8ed;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: inherit;
            transition: background-color .15s,border-color .15s,transform .06s
        }

            .social-btn:hover {
                background: #f5f7fb;
                border-color: #d9dee5
            }

            .social-btn:active {
                transform: scale(.98)
            }

            .social-btn svg {
                width: 18px;
                height: 18px;
                display: block
            }

        .lead {
            font-size: 14px;
            line-height: 1.6;
            color: #0f172a;
            margin: 6px 0 10px
        }

        .lead-row {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .catalog-empty {
            padding: 16px;
            border: 1px dashed #d7dbe3;
            border-radius: 12px;
            background: #fff;
            font-size: 14px;
            color: #374151;
        }

        /* Кликабельные карточки товара */
        .product-card.is-clickable {
            cursor: pointer;
        }

            .product-card.is-clickable:hover {
                border-color: #0d2b4e; /* если есть рамка — подсветится */
                box-shadow: 0 0 0 3px rgba(13,43,78,.12); /* «рамка» без сдвига верстки */

            .product-card.is-clickable:focus-visible {
                outline: 2px solid #0d2b4e;
                outline-offset: 2px; /* видимый фокус с клавиатуры */
            }

    <a class="float-viber"
       href="viber://pa?chatURI=radiobox"
       aria-label="Відкрити чат у Viber"

        <img class="vb vb--idle" src="../assets/icons/viber_without_cursor.png" alt="Viber" width="44" height="44">

    <!-- ===== Логіка категорії (єдиний шаблон) ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // === 1. ПОЛУЧЕНИЕ ПАРАМЕТРОВ URL ===
            function getParams() {
                const q = new URLSearchParams(location.search);
                // Если cat нет, только тогда ставим 'solder', иначе оставляем как есть!
                let cat = q.get('cat') || 'solder';
                let sub = q.get('sub') || '';
                return { cat, sub };
            }

            function setParams({ cat, sub }) {
                const u = new URL(location.href);
                if (cat) u.searchParams.set('cat', cat);
                if (sub) {
                    u.searchParams.set('sub', sub);
                } else {
                    u.searchParams.delete('sub');
                }
                // Перезаписываем только если реальные параметры каталога действительно изменились
                if (location.search !== u.search) {
                    history.replaceState(null, '', u.toString());
                }
            }

            let { cat, sub } = getParams();
            // Не вызываем setParams сразу, чтобы не ломать историю, если параметры верные

            // === 2. ДАННЫЕ О КАТЕГОРИЯХ (ИЗ API) ===
            // Нам нужно скачать список категорий, чтобы знать их красивые названия (title_ru/ua)
            let categoriesMap = [];

            try {
                const res = await fetch('/api/categories');
                const data = await res.json();
                if (data.success) {
                    categoriesMap = data.categories;
                }
            } catch (e) {
                console.error("Не удалось загрузить названия категорий", e);
            }

            const isUA = location.pathname.includes('/ua/');

            const getCatTitle = (slug) => {
                const found = categoriesMap.find(c => c.slug === slug);
                if (!found) return slug;
                return isUA ? (found.title_ua || found.title_ru) : found.title_ru;
            };

            // 1. Рекурсивная функция для сбора ВСЕХ вложенных ID категорий
            const getAllChildSlugs = (parentSlug) => {
                let childSlugs = [parentSlug];
                // Ищем всех прямых потомков текущей категории
                const directChildren = categoriesMap.filter(c => c.parent_slug === parentSlug);

                // Для каждого потомка вызываем функцию рекурсивно
                directChildren.forEach(child => {
                    childSlugs = childSlugs.concat(getAllChildSlugs(child.slug));
                });
                return childSlugs;
            };

            // === 3. ЭЛЕМЕНТЫ UI ===
            const catTitle = document.getElementById('catTitle');
            const crumbCat = document.getElementById('crumbCat');
            const crumbSepSub = document.getElementById('crumbSepSub');
            const crumbSub = document.getElementById('crumbSub');
            const subnav = document.getElementById('subcats');

            const sortSelect = document.getElementById('sortSelect');
            const pageSizeSelect = document.getElementById('pageSizeSelect');
            const pager = document.getElementById('catalogPager');
            const grid = document.getElementById('catalogGrid');
            const btnGrid = document.getElementById('btnGrid');
            const btnList = document.getElementById('btnList');
            const catalogSec = document.getElementById('catalog');

            const PRODUCT_PAGE = 'product.html';

            function openProduct(pid) {
                if (!pid) return;
                const u = new URL(PRODUCT_PAGE, document.baseURI);
                u.searchParams.set('id', pid);
                if (cat) u.searchParams.set('cat', cat);
                if (sub) u.searchParams.set('sub', sub);
                location.href = u.pathname + u.search;
            }

            if (grid) {
                grid.addEventListener('click', (e) => {
                if (e.target.closest('.product-card__buy')) return;
                const card = e.target.closest('.product-card.is-clickable');
                if (!card) return;

                const pid = card.dataset.id;
                const index = card.dataset.index ? parseInt(card.dataset.index, 10) : 0;

                const allItems = loadItems();
                const prod = allItems.find(p => p.id == pid);

                if (prod) {
                    const listName = getListNameForGA4();
                    pushGA4Event('select_item', [{
                        item_id: String(prod.sku || prod.id),
                        item_name: prod.title_ua || prod.title_ru || prod.title || 'Товар',
                        price: parseFloat(prod.price || 0),
                        item_category: prod.category || 'general',
                        item_list_id: cat || 'category_page',
                        item_list_name: listName,
                        index: index + 1 // GA4 начинает индексацию списков с 1
                    }]);
                }

                // Задержка 150мс, чтобы GA4 гарантированно успел отправить событие до загрузки новой страницы
                setTimeout(() => { openProduct(pid); }, 150);
                });
            }

            // === 4. ОБНОВЛЕНИЕ ЗАГОЛОВКОВ ===
            function refreshHead() {
                const niceTitle = getCatTitle(cat);
                document.title = 'RadioBox — ' + niceTitle;
                catTitle.textContent = niceTitle;

                // Определяем язык страницы
                const langAttr = (document.documentElement.getAttribute('lang') || '').toLowerCase();
                const isUA = langAttr.startsWith('uk') || langAttr === 'ua' || location.pathname.includes('/ua/');

                // Ищем подкатегории для текущего уровня (для cat или для sub, если зашли глубже)
                const currentLevel = sub || cat;
                const directChildren = categoriesMap.filter(c => c.parent_slug === currentLevel);

                if (directChildren.length > 0) {
                    subnav.hidden = false;
                    // Используем ваш класс из стилей
                    subnav.className = "groups__grid";

                    subnav.innerHTML = directChildren.map(item => {
                        // Текст названия в зависимости от языка
                        const title = isUA ? (item.title_ua || item.title_ru) : item.title_ru;

                        // Заглушка, если нет картинки
                        const placeholder = `https://placehold.co/300x200/f7f8fb/0d2b4e?text=${encodeURIComponent(title)}`;
                        const imgSrc = item.image_url || placeholder;

                        // Формируем HTML с вашими новыми классами
                        return `
                            <a href="?cat=${cat}&sub=${item.slug}" class="group-card">
                                <div class="group-card__img">
                                    <img src="${imgSrc}" alt="${title}">
                                </div>
                                <div class="group-card__title">${title}</div>
                            </a>
                        `;
                    }).join('');
                } else {
                    subnav.hidden = true;
                }

                // === ОБНОВЛЕННОЕ ОБНОВЛЕНИЕ ХЛЕБНЫХ КРОШЕК ===
                function updateBreadcrumbs() {
                    const breadcrumbsNav = document.querySelector('.breadcrumbs');
                    if (!breadcrumbsNav) return;

                    // Оставляем только иконку дома и ссылку "Товары"
                    const homeHtml = `<a class="crumb-home" href="index.html" aria-label="Главная">🏠</a>
                                      <span class="crumb-sep" aria-hidden="true">›</span>
                                      <a href="products.html">${isUA ? 'Товари' : 'Товары'}</a>`;

                    let chain = [];
                    let currentSlug = sub || cat;

                    // Собираем цепочку родителей вверх
                    let tempSlug = currentSlug;
                    while (tempSlug) {
                        const found = categoriesMap.find(c => c.slug === tempSlug);
                        if (found) {
                            chain.unshift(found);
                            tempSlug = found.parent_slug;
                        } else {
                            tempSlug = null;
                        }
                    }

                    // Собираем HTML цепочки
                    const chainHtml = chain.map((item, index) => {
                        const isLast = index === chain.length - 1;
                        const title = isUA ? (item.title_ua || item.title_ru) : item.title_ru;

                        // Если это последний элемент — он не кликабельный (текущая страница)
                        if (isLast) {
                            return `<span class="crumb-sep" aria-hidden="true">›</span>
                                    <span class="crumb-current">${title}</span>`;
                        } else {
                            // Формируем ссылку. Если это первый элемент, это cat, если дальше — sub.
                            // Самый надежный способ для type_of_product — передавать slug как cat
                            return `<span class="crumb-sep" aria-hidden="true">›</span>
                                    <a href="?cat=${item.slug}">${title}</a>`;
                        }
                    }).join('');

                    breadcrumbsNav.innerHTML = homeHtml + chainHtml;
                }

                // Вызовите её вместо старого блока:
                updateBreadcrumbs();
            }

            // === 5. РАБОТА С ДАННЫМИ (LocalStorage) ===
            const langAttr = (document.documentElement.getAttribute('lang') || '').toLowerCase();
            const IS_UA = langAttr.startsWith('uk') || langAttr === 'ua' || /\/ua\//i.test(location.pathname);
            const IS_RU = langAttr.startsWith('ru') || /\/ru\//i.test(location.pathname);
            const LS_KEY = IS_UA ? 'rb_catalog_v1_ua' : IS_RU ? 'rb_catalog_v1_ru' : 'rb_catalog_v1';

            const loadItems = () => {
                try {
                    const s = localStorage.getItem(LS_KEY);
                    if (!s) return [];
                    const o = JSON.parse(s);
                    return Array.isArray(o?.items) ? o.items : [];
                } catch { return []; }
            };

            const fromLS = (k, d) => localStorage.getItem(k) || d;

            // Настройки просмотра
            const LS_PAGESIZE = 'rb_catalog_pagesize';
            const LS_SORT = 'rb_catalog_sort';
            const LS_VIEW = 'rb_catalog_view';

            let pageSize = parseInt(localStorage.getItem(LS_PAGESIZE) || 6);
            let current = 1;
            let sortMode = fromLS(LS_SORT, 'default');
            let view = fromLS(LS_VIEW, 'grid');

            pageSizeSelect.value = String(pageSize);
            sortSelect.value = sortMode;

            // Фильтрация
            function filterByCatSub(all) {
                if (sub) {
                    // Если выбрана конкретная (под)категория, показываем товары из неё
                    // и из всего, что находится внутри неё (под-подкатегории)
                    const subAllowedSlugs = getAllChildSlugs(sub);
                    return all.filter(p => subAllowedSlugs.includes(p.subcategory) || subAllowedSlugs.includes(p.category));
                } else {
                    // Если выбрана только главная категория, собираем всё дерево вниз
                    const allAllowedSlugs = getAllChildSlugs(cat);
                    return all.filter(p => allAllowedSlugs.includes(p.category) || allAllowedSlugs.includes(p.subcategory));
                }
            }

            // Сортировка
            function sortItems(arr) {
                const c = arr.slice();

                c.sort((a, b) => {
                    // Сначала всегда сортируем по наличию (1 - есть, 0 - нет)
                    // b.in_stock - a.in_stock заставит товары в наличии быть первыми
                    if (b.in_stock !== a.in_stock) {
                        return b.in_stock - a.in_stock;
                    }

                    // Если наличие одинаковое, применяем выбранную сортировку
                    if (sortMode === 'price_asc') {
                        return a.price - b.price;
                    } else if (sortMode === 'price_desc') {
                        return b.price - a.price;
                    } else {
                        // По умолчанию (по позиции или ID)
                        // Предполагаем, что у товаров есть поле position, если нет - можно использовать id
                        return (a.position || a.id) - (b.position || b.id);
                    }
                });

                return c;
            }

            // Пагинация
            const totalPages = arr => Math.max(1, Math.ceil(arr.length / pageSize));
            const slicePage = (arr, p) => arr.slice((p - 1) * pageSize, (p - 1) * pageSize + pageSize);

            function buildPager(total, current, neighbors = 1) {
                const pages = new Set([1, total]);
                for (let i = current - neighbors; i <= current + neighbors; i++) if (i > 1 && i < total) pages.add(i);
                const nums = [...pages].sort((a, b) => a - b);

                let html = '';
                // Стрелка назад
                const prevDisabled = current === 1;
                html += `<a href="#" data-page="${current - 1}" ${prevDisabled ? 'style="pointer-events:none;opacity:0.5"' : ''}>←</a>`;

                nums.forEach((p, i) => {
                    if (i > 0 && (p - nums[i - 1]) > 1) html += '<span>…</span>';
                    html += p === current ? `<a href="#" data-page="${p}" aria-current="page"><strong>${p}</strong></a>` : `<a href="#" data-page="${p}">${p}</a>`;
                });

                // Стрелка вперед
                const nextDisabled = current === total;
                html += `<a href="#" data-page="${current + 1}" ${nextDisabled ? 'style="pointer-events:none;opacity:0.5"' : ''}>→</a>`;

                return html;
            }

            // Вспомогательная функция для GA4
            function getListNameForGA4() {
                const isUA = document.documentElement.lang === 'uk' || window.location.pathname.includes('/ua/');
                return getCatTitle(cat) || (isUA ? 'Каталог' : 'Каталог');
            }

            // HTML Генераторы
            function gridCardHTML(p, idx) {
                const isUA = document.documentElement.lang === 'uk' || window.location.pathname.includes('/ua/');
                const stClass = p.in_stock ? 'is-instock' : 'is-out';
                const stText = p.in_stock ? (isUA ? 'В наявності' : 'В наличии') : (isUA ? 'Немає' : 'Нет в наличии');
                const btnText = isUA ? 'Купити' : 'Купить';
                const txtStock = isUA ? 'На складі:' : 'На складе:';
                const uLabel = (p.unit_type === 'set') ? 'комплект.' : 'шт.';
                const qtyText = p.in_stock ? `<div style="font-size:12px; color:#6b7280; margin-top:2px;">${txtStock} <b>${p.qty_stock}</b> ${uLabel}</div>` : '';

                return `
                <article class="product-card is-clickable" data-id="${p.id}" data-index="${idx}" tabindex="0">
                    <div class="product-card__img">
                        <img src="${p.image || ''}" alt="${p.title}" loading="lazy">
                    </div>
                    <h3 class="product-card__title">${p.title}</h3>
                    <div class="product-card__meta">Code: <span>${p.sku}</span></div>
                    <div class="product-card__price">${p.price} ₴</div>
                    <div class="product-card__status ${stClass}">${stText}</div>
                    ${qtyText}
                    <button class="product-card__buy" type="button" onclick="event.stopPropagation(); window.rbAddToCart(${p.id});">${btnText}</button>
                </article>`;
            }

            function listCardHTML(p, idx) {
                const isUA = document.documentElement.lang === 'uk' || window.location.pathname.includes('/ua/');
                const stClass = p.in_stock ? 'is-instock' : 'is-out';
                const stText = p.in_stock ? (isUA ? 'В наявності' : 'В наличии') : (isUA ? 'Немає' : 'Нет в наличии');
                const btnText = isUA ? 'Купити' : 'Купить';
                const txtLeft = isUA ? 'Залишок:' : 'Остаток:';
                const qtyText = p.in_stock ? `<span style="font-size:13px; color:#666; margin-left:8px;">(${txtLeft} <b>${p.qty_stock}</b>)</span>` : '';

                return `
                <article class="product-card product-card--list is-clickable" data-id="${p.id}" data-index="${idx}" role="link" tabindex="0">
                  <div class="product-card__img"><img src="${p.image || ''}" alt="${p.title}"></div>
                  <div class="product-info">
                    <h3 class="product-card__title">${p.title}</h3>
                    <div class="product-card__price">${p.price} ₴</div>
                    <div class="product-card__status ${stClass}">
                        ${stText}
                        ${qtyText} </div>
                    <div class="product-meta-wrap">Код: <span>${p.sku}</span></div>
                  </div>
                  <div class="product-cta">
                    <button class="product-card__buy" type="button" onclick="event.stopPropagation(); window.rbAddToCart(${p.id});">${btnText}</button>
                  </div>
                </article>`;
            }

            function applyViewButtons() {
                btnGrid.classList.toggle('is-active', view === 'grid');
                btnList.classList.toggle('is-active', view === 'list');
                catalogSec.classList.toggle('list-view', view === 'list');
            }

            // === 6. ОСНОВНОЙ РЕНДЕР ===
            function render() {
                refreshHead();
                applyViewButtons();

                const all = loadItems();
                const filtered = filterByCatSub(all);
                const sorted = sortItems(filtered);
                const total = totalPages(sorted);
                if (current > total) current = total;

                // Пустое состояние
                if (sorted.length === 0) {
                    const catName = getCatTitle(cat);
                    grid.innerHTML = `
                        <div class="catalog-empty" style="text-align:center; padding:40px;">
                          ${IS_UA ? 'У цій категорії поки немає товарів.' : 'В этой категории пока нет товаров.'}
                          <br>
                          <a href="products.html" style="color:#0d2b4e; text-decoration:underline; margin-top:10px; display:inline-block;">
                            ${IS_UA ? 'Дивитись всі товари' : 'Смотреть все товары'}
                          </a>
                        </div>`;
                    pager.innerHTML = '';
                    return;
                }

                // Получаем товары для текущей страницы
                const pageItems = slicePage(sorted, current);

                // Рендерим HTML, прокидывая абсолютный индекс (index нужен для GA4)
                grid.innerHTML = pageItems.map((p, idx) => {
                    const absoluteIdx = ((current - 1) * pageSize) + idx;
                    return view === 'list' ? listCardHTML(p, absoluteIdx) : gridCardHTML(p, absoluteIdx);
                }).join('');

                pager.innerHTML = total > 1 ? buildPager(total, current, 1) : '';

                if (window.rbRefreshSideArt) window.rbRefreshSideArt();

                // Отправка события GA4 view_item_list
                const listName = getListNameForGA4();
                const ga4ListItems = pageItems.map((p, idx) => ({
                    item_id: String(p.sku || p.id),
                    item_name: p.title_ru || p.title || 'Товар',
                    price: parseFloat(p.price || 0),
                    item_category: p.category || 'general',
                    item_list_id: cat || 'category_page',
                    item_list_name: listName,
                    index: ((current - 1) * pageSize) + idx + 1 // Начинаем с 1
                }));

                if (ga4ListItems.length > 0) {
                    pushGA4Event('view_item_list', ga4ListItems);
                }
            }

            // Публичный метод для вызова из других скриптов
            window.renderCatalog = render;

            // === 7. СОБЫТИЯ ===
            pager.addEventListener('click', e => {
                const a = e.target.closest('a[data-page]'); if (!a) return;
                e.preventDefault();
                const p = parseInt(a.dataset.page, 10); if (!Number.isFinite(p)) return;
                current = Math.max(1, p); render();
                catalogSec?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            pageSizeSelect.addEventListener('change', () => {
                pageSize = parseInt(pageSizeSelect.value, 10) || 6;
                localStorage.setItem(LS_PAGESIZE, String(pageSize));
                current = 1; render();
            });

            sortSelect.addEventListener('change', () => {
                sortMode = sortSelect.value || 'default';
                localStorage.setItem(LS_SORT, sortMode);
                current = 1; render();
            });

            btnGrid.addEventListener('click', () => {
                if (view === 'grid') return;
                view = 'grid'; localStorage.setItem(LS_VIEW, view); render();
            });
            btnList.addEventListener('click', () => {
                if (view === 'list') return;
                view = 'list'; localStorage.setItem(LS_VIEW, view); render();
            });

            window.addEventListener('popstate', () => {
                const p = getParams(); cat = p.cat; sub = p.sub; current = 1; render();
            });

            // ПЕРВЫЙ ЗАПУСК
            render();
        });
    </script>

    <!-- Бокові картинки -->
    <div class="side-art side-art--left" data-src="../assets/photos/photos_left_right/left.jpg" aria-hidden="true"></div>
    <div class="side-art side-art--right" data-src="../assets/photos/photos_left_right/right.jpg" aria-hidden="true"></div>

</body>
</html>
