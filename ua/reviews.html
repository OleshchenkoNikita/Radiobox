<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RadioBox — Відгуки</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="preload" as="image" href="../assets/icons/viber_under_cursor.png">
</head>
<body>

    <div id="header-placeholder"></div>

    <!-- Двохколонна область -->
    <section class="home-layout container">
        <!-- Ліва колонка -->
        <div id="sidebar-placeholder"></div>

        <!-- Права колонка -->
        <div class="home-right">

            <!-- Хлібні крихти -->
            <nav class="breadcrumbs" aria-label="Хлібні крихти">
                <a class="crumb-home" href="index.html" aria-label="Головна">🏠</a>
                <span class="crumb-sep" aria-hidden="true">›</span>
                <a class="crumb-current" href="reviews.html" aria-current="page">Відгуки</a>
            </nav>

            <!-- Контент: список відгуків -->
            <section class="reviews-page">
                <h2 class="groups__title">Відгуки</h2>

                <div class="reviews-actions">
                    <a class="btn-add-review" href="#" title="Залишити відгук">Залишити відгук</a>
                </div>

                <!-- Форма добавления отзыва -->
                <form id="reviewForm" class="review-form" hidden novalidate>
                    <!-- Ряд: ФИ + рейтинг -->
                    <div class="rf-row">
                        <label class="rf-name">
                            <span class="rf-label">Ім'я та прізвище</span>
                            <input id="rfName" type="text" name="author" maxlength="120" placeholder="Ваше ім'я та прізвище">
                            <small class="rf-error" id="errName" aria-live="polite"></small>
                        </label>

                        <fieldset class="rf-rating">
                            <legend class="rf-label">Оцінка</legend>
                            <div class="stars" role="radiogroup" aria-label="Оцінка">
                                <!-- 5..1 чтобы звёзды шли слева-направо как обычно -->
                                <input type="radio" id="star5" name="rating" value="5">
                                <label for="star5" aria-label="5">★</label>
                                <input type="radio" id="star4" name="rating" value="4">
                                <label for="star4" aria-label="4">★</label>
                                <input type="radio" id="star3" name="rating" value="3">
                                <label for="star3" aria-label="3">★</label>
                                <input type="radio" id="star2" name="rating" value="2">
                                <label for="star2" aria-label="2">★</label>
                                <input type="radio" id="star1" name="rating" value="1">
                                <label for="star1" aria-label="1">★</label>
                            </div>
                            <small class="rf-error" id="errRating" aria-live="polite"></small>
                        </fieldset>
                    </div>

                    <!-- Комментарий + счётчик -->
                    <div class="rf-row rf-comment-row">
                        <label class="rf-comment">
                            <span class="rf-label">Коментар (необов'язково)</span>
                            <textarea id="rfComment" name="comment" maxlength="300" rows="4" placeholder="Ваш відгук (до 300 символів)"></textarea>
                        </label>
                        <div class="rf-count"><span id="rfCnt">0</span>/300</div>
                    </div>

                    <!-- Кнопки -->
                    <div class="rf-actions">
                        <button type="submit" class="rf-btn rf-btn--primary">Зберегти</button>
                        <button type="button" class="rf-btn rf-btn--ghost" id="rfCancel">Скасувати</button>
                    </div>
                </form>

                <div id="revList" class="rev-list" aria-live="polite"></div>
                <div class="rev-pager" id="revPager"></div>
            </section>

        </div>
    </section>

    <!-- Плаваюча кнопка Viber -->
    <a class="float-viber" href="viber://chat?number=%2B380930728887" aria-label="Відкрити чат у Viber" title="Відкрити чат у Viber">
        <img class="vb vb--idle" src="../assets/icons/viber_without_cursor.png" alt="Viber" width="44" height="44">
        <img class="vb vb--hover" src="../assets/icons/viber_under_cursor.png" alt="" aria-hidden="true" width="44" height="44">
    </a>

    <div id="footer-placeholder"></div>

    <!-- ===== MODAL: Графік роботи ===== -->
    <div class="hours-modal" aria-hidden="true">
        <div class="hours-modal__backdrop" data-hours-close></div>
        <section class="hours-modal__panel" role="dialog" aria-modal="true" aria-labelledby="hoursTitle">
            <header class="hours-modal__header">
                <h2 id="hoursTitle" class="hours-modal__title">Графік роботи</h2>
                <button type="button" class="hours-modal__close" aria-label="Закрити" data-hours-close>×</button>
            </header>
            <div class="hours-modal__body">
                <!-- таблиця як і на інших сторінках -->
                <table class="hours-table">
                    <thead><tr><th>День</th><th>Час роботи</th></tr></thead>
                    <tbody>
                        <tr><th>Понеділок</th><td>08:00 – 20:00</td></tr>
                        <tr><th>Вівторок</th><td>08:00 – 20:00</td></tr>
                        <tr><th>Середа</th><td>08:00 – 20:00</td></tr>
                        <tr><th>Четвер</th><td>08:00 – 20:00</td></tr>
                        <tr><th>Пʼятниця</th><td>08:00 – 20:00</td></tr>
                        <tr><th>Субота</th><td>10:00 – 18:00</td></tr>
                        <tr><th>Неділя</th><td>10:00 – 15:00</td></tr>
                    </tbody>
                </table>
                <p class="hours-note">* Час указано для регіону: Україна, м. Шостка</p>
            </div>
        </section>
    </div>

    <!-- Бокові картинки -->
    <div class="side-art side-art--left" data-src="../assets/photos/photos_left_right/left.jpg" aria-hidden="true"></div>
    <div class="side-art side-art--right" data-src="../assets/photos/photos_left_right/right.jpg" aria-hidden="true"></div>

    <script src="../script.js" defer></script>
</body>
</html>
